---
- name: Bootstrap tasks
  tags: [always]
  block:
    # Access bootstrap_* facts directly instead via ansible_facts here and in downstream roles
    # so bootstrap.yml runs once even with persistent fact caching.
    - name: Include bootstrap tasks if necessary
      when: bootstrap_included is undefined or not bootstrap_included
      ansible.builtin.include_tasks:
        file: bootstrap.yml

    - name: Include package update cache tasks if necessary
      when: bootstrap_package_update_cache
      ansible.builtin.include_tasks:
        file: package-update-cache.yml

    - name: Bootstrap role completed
      ansible.builtin.assert:
        that: true
        quiet: true
