---
# Molecule base configuration, deep-merged under every scenario's molecule.yml; see _scripts/tests/MOLECULE.md.
# Molecule reads extensions/molecule/config.yml of the collection it runs from; the other collections
# symlink this file. Run molecule from a collection directory or via _scripts/tests/molecule.py.

# Source-only collections: ansible-compat must not install anything.
prerun: false

# Nothing to install.
dependency:
  name: galaxy
  enabled: false

driver:
  name: podman

# Rootless containers with systemd as PID 1, without --privileged and CAP_SYS_ADMIN.
# The images are built once by the oszi.utils.molecule.build playbook, which molecule.py runs ahead of
# the scenarios; the driver never builds them and fails in the create step when one is missing.
# MOLECULE_BUILD_IMAGE_PREFIX and MOLECULE_BUILD_{FEDORA,DEBIAN,UBUNTU}_VERSION select the images here
# and in the build playbook; same defaults in both.
platforms:
  - name: "${MOLECULE_SCENARIO_NAME}-fedora"
    image: "${MOLECULE_BUILD_IMAGE_PREFIX:-localhost/molecule_local/oszi/}fedora:${MOLECULE_BUILD_FEDORA_VERSION:-latest}"
    pre_build_image: true
    command: "/sbin/init"
    systemd: always
    groups: [fedora, redhat]
  - name: "${MOLECULE_SCENARIO_NAME}-debian"
    image: "${MOLECULE_BUILD_IMAGE_PREFIX:-localhost/molecule_local/oszi/}debian:${MOLECULE_BUILD_DEBIAN_VERSION:-stable}"
    pre_build_image: true
    command: "/sbin/init"
    systemd: always
    groups: [debian]
  - name: "${MOLECULE_SCENARIO_NAME}-ubuntu"
    image: "${MOLECULE_BUILD_IMAGE_PREFIX:-localhost/molecule_local/oszi/}ubuntu:${MOLECULE_BUILD_UBUNTU_VERSION:-latest}"
    pre_build_image: true
    command: "/sbin/init"
    systemd: always
    groups: [ubuntu, debian]

ansible:
  cfg:
    defaults:
      collections_path: "${MOLECULE_PROJECT_DIRECTORY}/../../..:~/.ansible/collections:/usr/share/ansible/collections"
      gathering: explicit
      inject_facts_as_vars: false
      pipelining: true
      strategy: free
      verbosity: 1
  executor:
    args:
      ansible_playbook:
        - "--diff"

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

provisioner:
  inventory:
    group_vars:
      all:
        ansible_user: root
        # The images ship package metadata no older than their TTL (see the build playbook); refreshing it
        # would cost every container a download, and dnf still refreshes repositories past metadata_expire.
        bootstrap_package_update_cache: false
