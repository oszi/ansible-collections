---
# Molecule scenario for oszi.utils.facts; shared settings come from ../config.yml.
# The custom converge.yml gathers subsets through both entrypoints and asserts the facts in the same play,
# because gathered facts and the subset cache only live in the controller's memory during one run.
# Its plays cover the branches of the role's vars/main.yml; the cache seeded without any prior gathering
# is covered by the facts-rootless scenario, as a run seeds the cache only once.
# The seeded local fact lives outside the default facts.d, so only gathering with facts_path finds it.
provisioner:
  inventory:
    group_vars:
      all:
        molecule_prepare_seed_files:
          - path: /etc/molecule/facts.d/molecule.fact
            content: '{"seeded": true}'
      fedora:
        # The network subset reads interfaces and routes with ip; the base images do not ship it.
        molecule_prepare_packages: [iproute]
      debian:
        molecule_prepare_packages: [iproute2]
