---
- name: Import the shared prepare playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.prepare

# The images ship the package metadata, which would satisfy the verify commands without the role's cache update.
- name: Remove the package metadata shipped by the images
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Remove the dnf metadata
      when: "'fedora' in group_names"
      ansible.builtin.command:
        argv: [dnf, clean, all]
      changed_when: true

    # apt compares cache_valid_time with the mtime of the lists directory (the images have no
    # update-success-stamp), which the removal refreshes; an old mtime makes the role's update run.
    - name: Remove the apt lists and age the lists directory
      when: "'debian' in group_names"
      ansible.builtin.shell:
        cmd: "set -euo pipefail; rm -rf -- /var/lib/apt/lists/*; touch -d '1970-01-02' /var/lib/apt/lists"
        executable: /bin/bash
      changed_when: true
