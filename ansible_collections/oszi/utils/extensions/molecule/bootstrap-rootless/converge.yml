---
# Custom converge: the bootstrap facts only live on the controller, so the assertions run in the same play.
- name: Converge the bootstrap role as the test user
  hosts: all
  become: true
  become_user: "{{ molecule_become_user }}"
  gather_facts: false
  tasks:
    - name: Import bootstrap role
      ansible.builtin.import_role:
        name: oszi.utils.bootstrap

    - name: Assert the bootstrap facts
      ansible.builtin.assert:
        that:
          - "bootstrap_is_ssh is false"
          - "bootstrap_ssh_port == 22"
          - "bootstrap_included is true"
        quiet: true

    - name: Import facts role
      ansible.builtin.import_role:
        name: oszi.utils.facts

    - name: Assert that the bootstrap ran as the test user
      ansible.builtin.assert:
        that:
          - "ansible_facts.user_id == 'tester'"
          - "ansible_facts.user_uid | int != 0"
        quiet: true
