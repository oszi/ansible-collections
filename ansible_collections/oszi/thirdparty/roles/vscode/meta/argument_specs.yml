---
argument_specs:
  main:
    short_description: Visual Studio Code installation from Microsoft
    description:
      - Manages Visual Studio Code installation from Microsoft's official repository for Debian and RedHat systems
      - Supports custom repository mirrors
    author:
      - "David O. (oszi.dev)"
    options:
      vscode_enabled:
        description:
          - Whether to install or uninstall Visual Studio Code
          - Disabled by default
        type: bool
        required: false
        default: false

      vscode_rpm_baseurl:
        description:
          - Base URL for the Visual Studio Code RPM repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      vscode_deb_baseurl:
        description:
          - Base URL for the Visual Studio Code Debian/Ubuntu repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      vscode_rpm_gpgkey_url:
        description:
          - URL of the GPG public key for the Visual Studio Code RPM repository
          - Microsoft publishes one signing key for all of its repositories
          - Change for custom mirrors or proxies
        type: str
        required: false

      vscode_rpm_gpgkey_checksum:
        description:
          - Checksum in algo:hash or algo:URL format for O(vscode_rpm_gpgkey_url)
        type: str
        required: false

      vscode_deb_gpgkey_url:
        description:
          - URL of the GPG public key for the Visual Studio Code Debian/Ubuntu repository
          - Microsoft publishes one signing key for all of its repositories
          - Change for custom mirrors or proxies
        type: str
        required: false

      vscode_deb_gpgkey_armored:
        description:
          - Whether the key at O(vscode_deb_gpgkey_url) is ASCII-armored
          - Selects the .asc or .gpg keyring name apt requires for that format
        type: bool
        required: false
        default: true

      vscode_deb_gpgkey_checksum:
        description:
          - Checksum in algo:hash or algo:URL format for O(vscode_deb_gpgkey_url)
        type: str
        required: false

      vscode_deb_arch:
        description:
          - Space or comma-separated list of Debian repository architectures to enable
        type: str
        required: false

      vscode_microsoft_gpgkey_used_elsewhere:
        description:
          - Whether the Microsoft GPG key is used by other repositories
          - When false and Visual Studio Code is disabled, the Microsoft GPG key will be removed
          - Set to true if other Microsoft products are installed (e.g., Azure CLI, PowerShell)
        type: bool
        required: false
