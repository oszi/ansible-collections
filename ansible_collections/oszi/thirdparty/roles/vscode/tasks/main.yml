---
- name: Visual Studio Code tasks
  tags: [vscode]
  block:
    - name: Visual Studio Code repository
      ansible.builtin.include_tasks:
        file: "{{ ansible_facts.os_family | lower }}/{{ vscode_enabled | ternary('install', 'uninstall') }}.yml"

    - name: Ensure Code is present or absent
      ansible.builtin.package:
        name: "{{ vscode_enabled | ternary(vscode_package, vscode_all_packages) }}"
        state: "{{ vscode_enabled | ternary('present', 'absent') }}"
