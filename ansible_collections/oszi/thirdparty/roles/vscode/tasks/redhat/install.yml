---
- name: Download VS Code RPM signing key
  ansible.builtin.get_url:
    url: "{{ vscode_rpm_gpgkey_url }}"
    dest: "{{ vscode_rpm_gpgkey_path }}"
    checksum: "{{ vscode_rpm_gpgkey_checksum | default(omit, true) }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Install VS Code RPM repository
  ansible.builtin.yum_repository:
  args: "{{ vscode_rpm_repo_args }}"
