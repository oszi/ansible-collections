---
- name: Copy VS Code RPM signing key
  ansible.builtin.copy:
    src: "{{ vscode_rpm_gpgkey_path.lstrip('/') }}"
    dest: "{{ vscode_rpm_gpgkey_path }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Stat VS Code RPM repository
  ansible.builtin.stat:
    path: "{{ vscode_rpm_repo_path }}"
  register: _vscode_rpm_repo_stat

# XXX: Earlier role versions made this file immutable.
- name: Ensure vscode.repo is NOT immutable
  when: "_vscode_rpm_repo_stat.stat.exists and 'immutable' in _vscode_rpm_repo_stat.stat.attributes"
  ansible.builtin.file:
    path: "{{ vscode_rpm_repo_path }}"
    attr: "-i"

- name: Install VS Code RPM repository
  ansible.builtin.yum_repository:
  args: "{{ vscode_rpm_repo_args }}"
