---
- name: Stat VS Code RPM repository
  ansible.builtin.stat:
    path: "{{ vscode_rpm_repo_path }}"
  register: _vscode_rpm_repo_stat

# XXX: Earlier role versions made this file immutable.
- name: Ensure vscode.repo is NOT immutable
  when: "_vscode_rpm_repo_stat.stat.exists and 'immutable' in _vscode_rpm_repo_stat.stat.attributes"
  ansible.builtin.file:
    path: "{{ vscode_rpm_repo_path }}"
    attr: "-i"

- name: Uninstall VS Code RPM repository
  ansible.builtin.file:
    path: "{{ vscode_rpm_repo_path }}"
    state: "absent"

- name: Uninstall Microsoft RPM signing key
  when: not vscode_microsoft_gpgkey_used_elsewhere
  ansible.builtin.file:
    path: "{{ vscode_rpm_gpgkey_path }}"
    state: "absent"
