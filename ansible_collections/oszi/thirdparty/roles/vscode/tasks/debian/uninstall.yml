---
- name: Stat VS Code deb repository files
  ansible.builtin.stat:
    path: "{{ item }}"
  with_items:
    - "{{ vscode_deb_repo_path }}"
    - "{{ vscode_deb_repo_legacy_path }}"
  register: _vscode_deb_repo_stat

# XXX: Earlier role versions made these files immutable.
- name: Ensure VS Code deb repository files are NOT immutable
  when: "item.stat.exists and 'immutable' in item.stat.attributes"
  ansible.builtin.file:
    path: "{{ item.item }}"
    attr: "-i"
  with_items: "{{ _vscode_deb_repo_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Uninstall VS Code deb repository
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items:
    - "{{ vscode_deb_repo_path }}"
    - "{{ vscode_deb_repo_legacy_path }}"

- name: Uninstall Microsoft deb signing keys
  when: not vscode_microsoft_gpgkey_used_elsewhere
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items:
    - "{{ vscode_deb_gpgkey_path }}"
    - "{{ vscode_deb_gpgkey_legacy_path }}"
