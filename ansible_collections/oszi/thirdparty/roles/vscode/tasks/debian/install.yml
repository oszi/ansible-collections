---
- name: Ensure directory for VS Code deb signing key
  ansible.builtin.file:
    path: "{{ vscode_deb_gpgkey_path | dirname }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: Download VS Code deb signing key
  ansible.builtin.get_url:
    url: "{{ vscode_deb_gpgkey_url }}"
    dest: "{{ vscode_deb_gpgkey_path }}"
    checksum: "{{ vscode_deb_gpgkey_checksum }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: _vscode_deb_gpgkey_result

- name: Remove unmanaged VS Code deb files
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items: "{{ vscode_deb_absent_paths }}"
  register: _vscode_deb_cleanup_result

# Must be answered before the package installs: the postinst otherwise
# rewrites vscode.sources and installs its own keyring.
- name: Disable repository management by the code deb package
  ansible.builtin.debconf:
    name: "code"
    question: "code/add-microsoft-repo"
    vtype: "boolean"
    value: "false"

- name: Install VS Code deb repository
  ansible.builtin.copy:
    dest: "{{ vscode_deb_repo_path }}"
    content: "{{ vscode_deb_repo }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: _vscode_deb_repo_result

- name: Update apt cache
  when: _vscode_deb_gpgkey_result.changed or _vscode_deb_cleanup_result.changed
    or _vscode_deb_repo_result.changed
  ansible.builtin.apt:
    update_cache: true
