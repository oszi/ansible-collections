---
- name: Ensure directory for VS Code deb signing key
  ansible.builtin.file:
    path: "{{ vscode_deb_gpgkey_path | dirname }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: Copy VS Code deb signing key
  ansible.builtin.copy:
    src: "{{ vscode_deb_gpgkey_path.lstrip('/') }}"
    dest: "{{ vscode_deb_gpgkey_path }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Remove legacy Microsoft deb signing key
  when: not vscode_microsoft_gpgkey_used_elsewhere
  ansible.builtin.file:
    path: "{{ vscode_deb_gpgkey_legacy_path }}"
    state: "absent"

# Must be answered before the package installs: the postinst otherwise
# rewrites vscode.sources and installs its own keyring.
- name: Disable repository management by the code deb package
  ansible.builtin.debconf:
    name: "code"
    question: "code/add-microsoft-repo"
    vtype: "boolean"
    value: "false"

- name: Remove legacy VS Code deb repository
  ansible.builtin.file:
    path: "{{ vscode_deb_repo_legacy_path }}"
    state: "absent"
  register: _vscode_deb_repo_legacy_result

- name: Install VS Code deb repository
  ansible.builtin.copy:
    dest: "{{ vscode_deb_repo_path }}"
    content: "{{ vscode_deb_repo }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: _vscode_deb_repo_result

- name: Update apt cache
  when: _vscode_deb_repo_legacy_result.changed or _vscode_deb_repo_result.changed
  ansible.builtin.apt:
    update_cache: true
