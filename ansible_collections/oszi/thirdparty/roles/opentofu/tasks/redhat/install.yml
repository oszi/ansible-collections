---
- name: Download OpenTofu RPM signing keys
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.path }}"
    checksum: "{{ item.checksum | default(omit, true) }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_items: "{{ opentofu_rpm_gpgkey_list }}"

- name: Install OpenTofu RPM repository
  ansible.builtin.yum_repository:
    file: "opentofu"
    name: "opentofu"
    description: "OpenTofu Upstream"
    includepkgs: "{{ opentofu_rpm_includepkgs }}"
    baseurl: "{{ opentofu_rpm_baseurl }}"
    gpgkey: "{{ opentofu_rpm_gpgkey_paths | map('regex_replace', '^(.*)$', 'file://\\1') | list }}"
    gpgcheck: true
    repo_gpgcheck: false
    enabled: true
