---
- name: Download OpenTofu RPM signing keys
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.path }}"
    checksum: "{{ item.checksum }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_items: "{{ opentofu_rpm_gpgkey_list }}"

- name: Install OpenTofu RPM repository
  ansible.builtin.yum_repository:
  args: "{{ opentofu_rpm_repo_args }}"
