---
argument_specs:
  main:
    short_description: OpenTofu installation - a Terraform alternative
    description:
      - Manages OpenTofu installation, an open-source Terraform alternative
      - Supports upstream repositories and distribution packages
      - Configures package sources for Debian and RPM-based systems
    author:
      - "David O. (oszi.dev)"
    options:
      opentofu_enabled:
        description:
          - Whether to install or uninstall OpenTofu
          - Disabled by default
        type: bool
        required: false
        default: false

      opentofu_upstream_enabled:
        description:
          - Whether to install the upstream/external deb/rpm repository
          - When upstream is enabled, installs 'tofu' package
          - When upstream is disabled, installs 'opentofu' from the distribution (e.g., Fedora)
        type: bool
        required: false

      opentofu_rpm_baseurl:
        description:
          - Base URL for the OpenTofu RPM repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      opentofu_deb_baseurl:
        description:
          - Base URL for the OpenTofu Debian/Ubuntu repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      opentofu_rpm_gpgkey_url:
        description:
          - URL of the OpenTofu package signing key for the OpenTofu RPM repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      opentofu_rpm_gpgkey_checksum:
        description:
          - Checksum in algo:hash format for O(opentofu_rpm_gpgkey_url)
          - Set to an empty string to skip verification
        type: str
        required: false

      opentofu_deb_gpgkey_url:
        description:
          - URL of the OpenTofu package signing key for the OpenTofu Debian/Ubuntu repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      opentofu_deb_gpgkey_armored:
        description:
          - Whether the key at O(opentofu_deb_gpgkey_url) is ASCII-armored
          - Selects the .asc or .gpg keyring name apt requires for that format
        type: bool
        required: false
        default: false

      opentofu_deb_gpgkey_checksum:
        description:
          - Checksum in algo:hash format for O(opentofu_deb_gpgkey_url)
          - Set to an empty string to skip verification
        type: str
        required: false

      opentofu_rpm_repo_gpgkey_url:
        description:
          - URL of the repository host (packagecloud) signing key for the OpenTofu RPM repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      opentofu_rpm_repo_gpgkey_checksum:
        description:
          - Checksum in algo:hash format for O(opentofu_rpm_repo_gpgkey_url)
          - Set to an empty string to skip verification
        type: str
        required: false

      opentofu_deb_repo_gpgkey_url:
        description:
          - URL of the repository host (packagecloud) signing key for the OpenTofu Debian/Ubuntu repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      opentofu_deb_repo_gpgkey_armored:
        description:
          - Whether the key at O(opentofu_deb_repo_gpgkey_url) is ASCII-armored
          - Selects the .asc or .gpg keyring name apt requires for that format
        type: bool
        required: false
        default: true

      opentofu_deb_repo_gpgkey_checksum:
        description:
          - Checksum in algo:hash format for O(opentofu_deb_repo_gpgkey_url)
          - Set to an empty string to skip verification
        type: str
        required: false
