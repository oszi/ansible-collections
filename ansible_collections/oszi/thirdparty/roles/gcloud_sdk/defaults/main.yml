---
# Install Google Cloud SDK? Only enabled by default on Google Cloud, never in containers (host DMI).
gcloud_sdk_enabled: "{{ ansible_facts.system_vendor == 'Google'
  and 'container' not in ansible_facts.virtualization_tech_guest }}"

# Install Google Cloud SDK App Engine components?
gcloud_sdk_app_engine_enabled: false

# Install Google Cloud SDK emulator components?
gcloud_sdk_emulators_enabled: false

# Install minikube from Google Cloud?
gcloud_sdk_minikube_enabled: false

# Install the GKE auth plugin for kubectl (kubectl itself comes from oszi.thirdparty.k8s_pkgs)?
gcloud_sdk_gke_auth_plugin_enabled: false

# List of (all) emulator packages:
gcloud_sdk_emulators_packages:
  - google-cloud-cli-bigtable-emulator
  - google-cloud-cli-datastore-emulator
  - google-cloud-cli-firestore-emulator
  - google-cloud-cli-pubsub-emulator
  - google-cloud-cli-spanner-emulator

# List of (all) App Engine packages:
gcloud_sdk_app_engine_packages:
  - google-cloud-cli-app-engine-go
  - google-cloud-cli-app-engine-grpc
  - google-cloud-cli-app-engine-java
  - google-cloud-cli-app-engine-python
  - google-cloud-cli-app-engine-python-extras

# Repo base URLs - change for custom mirrors
gcloud_sdk_rpm_baseurl: "https://packages.cloud.google.com/yum/repos/cloud-sdk-el10-$basearch"
gcloud_sdk_deb_baseurl: "https://packages.cloud.google.com/apt"

# GPG public key URLs - change for custom mirrors
gcloud_sdk_rpm_gpgkey_url: "https://packages.cloud.google.com/yum/doc/rpm-package-key-v10.gpg"
gcloud_sdk_deb_gpgkey_url: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
# Whether the deb key is ASCII-armored - selects the .asc or .gpg keyring name apt requires
gcloud_sdk_deb_gpgkey_armored: true

# Checksums (algo:hash) for GPG public key downloads - set to "" to skip verification
gcloud_sdk_rpm_gpgkey_checksum: "sha256:1b27dc93dfb8fa150f90979edfeae30eed0bc8236a065db8e1c2d0817b382473"
gcloud_sdk_deb_gpgkey_checksum: "sha256:3ecc63922b7795eb23fdc449ff9396f9114cb3cf186d6f5b53ad4cc3ebfbb11f"

# Path for local executables
gcloud_sdk_local_bin_path: "{{ local_bin_path | default('/usr/local/bin', true) }}"
