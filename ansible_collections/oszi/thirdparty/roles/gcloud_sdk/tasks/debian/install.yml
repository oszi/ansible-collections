---
- name: Ensure directory for GCloud SDK deb signing key
  ansible.builtin.file:
    path: "{{ gcloud_sdk_deb_gpgkey_path | dirname }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: Download GCloud SDK deb signing key
  ansible.builtin.get_url:
    url: "{{ gcloud_sdk_deb_gpgkey_url }}"
    dest: "{{ gcloud_sdk_deb_gpgkey_path }}"
    checksum: "{{ gcloud_sdk_deb_gpgkey_checksum | default(omit, true) }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Remove unmanaged GCloud SDK deb files
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items: "{{ gcloud_sdk_deb_absent_paths }}"

- name: Install GCloud SDK deb repository
  ansible.builtin.copy:
    dest: "{{ gcloud_sdk_deb_repo_path }}"
    content: "{{ gcloud_sdk_deb_repo }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: _gcloud_sdk_deb_repo_result

- name: Update apt cache
  when: _gcloud_sdk_deb_repo_result.changed
  ansible.builtin.apt:
    update_cache: true
