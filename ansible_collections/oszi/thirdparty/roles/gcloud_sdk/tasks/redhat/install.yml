---
- name: Download GCloud SDK RPM signing key
  ansible.builtin.get_url:
    url: "{{ gcloud_sdk_rpm_gpgkey_url }}"
    dest: "{{ gcloud_sdk_rpm_gpgkey_path }}"
    checksum: "{{ gcloud_sdk_rpm_gpgkey_checksum | default(omit, true) }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Install GCloud SDK RPM repository
  ansible.builtin.yum_repository:
  args: "{{ gcloud_sdk_rpm_repo_args }}"

- name: Install GCloud SDK unstable RPM repository
  ansible.builtin.yum_repository:
  args: "{{ gcloud_sdk_rpm_repo_unstable_args }}"
