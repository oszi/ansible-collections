---
gcloud_sdk_rpm_gpgkey_path: "/etc/pki/rpm-gpg/RPM-GPG-KEY-google-cloud-sdk"
gcloud_sdk_rpm_repo_path: "/etc/yum.repos.d/google-cloud-sdk.repo"
gcloud_sdk_rpm_includepkgs: "{{ ['google-cloud-*']
  + (['kubectl'] if gcloud_sdk_kubectl_enabled else []) }}"

gcloud_sdk_rpm_repo_args:
  file: "{{ (gcloud_sdk_rpm_repo_path | basename).removesuffix('.repo') }}"
  name: "google-cloud-sdk"
  description: "GCloud SDK"
  includepkgs: "{{ gcloud_sdk_rpm_includepkgs }}"
  baseurl: "{{ gcloud_sdk_rpm_baseurl }}"
  gpgkey: "file://{{ gcloud_sdk_rpm_gpgkey_path }}"
  gpgcheck: true
  repo_gpgcheck: false
  enabled: true

gcloud_sdk_rpm_repo_unstable_args:
  file: "{{ (gcloud_sdk_rpm_repo_path | basename).removesuffix('.repo') }}"
  name: "google-cloud-sdk-unstable"
  description: "GCloud SDK - Unstable"
  includepkgs: "{{ gcloud_sdk_rpm_includepkgs }}"
  baseurl: "{{ gcloud_sdk_rpm_baseurl }}-unstable"
  gpgkey: "file://{{ gcloud_sdk_rpm_gpgkey_path }}"
  gpgcheck: true
  repo_gpgcheck: false
  enabled: false

gcloud_sdk_deb_gpgkey_path: "/etc/apt/keyrings/google-cloud-sdk.{{ gcloud_sdk_deb_gpgkey_armored | ternary('asc', 'gpg') }}"
gcloud_sdk_deb_absent_paths:
  - "/etc/apt/keyrings/google-cloud-sdk.{{ gcloud_sdk_deb_gpgkey_armored | ternary('gpg', 'asc') }}"
  - "/etc/apt/sources.list.d/gce_sdk.list"
  - "/etc/apt/sources.list.d/google-cloud-sdk.list"

gcloud_sdk_deb_repo_path: "/etc/apt/sources.list.d/google-cloud-sdk.sources"
gcloud_sdk_deb_repo: |
  Types: deb
  URIs: {{ gcloud_sdk_deb_baseurl }}
  Suites: cloud-sdk
  Components: main
  Signed-By: {{ gcloud_sdk_deb_gpgkey_path }}
