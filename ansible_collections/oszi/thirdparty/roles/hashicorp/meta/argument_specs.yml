---
argument_specs:
  main:
    short_description: HashiCorp repository and package management
    description:
      - Manages installation of HashiCorp packages from official repositories
      - Manages package sources for Debian and RPM-based systems
      - Supports Terraform, Vault, Consul, Nomad, Packer, and other HashiCorp tools
    author:
      - "David O. (oszi.dev)"
    options:
      hashicorp_enabled:
        description:
          - Whether to install or uninstall HashiCorp packages
          - Disabled by default
        type: bool
        required: false
        default: false

      hashicorp_packages:
        description:
          - Nested list of HashiCorp package names to install (or uninstall)
          - Available packages for RPM are restricted by hashicorp_includepkgs in hashicorp/vars/main.yml
        type: list
        elements: str
        required: false

      hashicorp_blacklisted_packages:
        description:
          - Nested list of HashiCorp package names to always uninstall
        type: list
        elements: str
        required: false

      hashicorp_rpm_baseurl:
        description:
          - Base URL for the HashiCorp RPM repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      hashicorp_deb_baseurl:
        description:
          - Base URL for the HashiCorp Debian/Ubuntu repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      hashicorp_rpm_gpgkey_url:
        description:
          - URL of the GPG public key for the HashiCorp RPM repository
          - Shared by the stable and test repository entries
          - Change for custom mirrors or proxies
        type: str
        required: false

      hashicorp_rpm_gpgkey_checksum:
        description:
          - Checksum in algo:hash format for O(hashicorp_rpm_gpgkey_url)
          - Set to an empty string to skip verification
        type: str
        required: false

      hashicorp_deb_gpgkey_url:
        description:
          - URL of the GPG public key for the HashiCorp Debian/Ubuntu repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      hashicorp_deb_gpgkey_armored:
        description:
          - Whether the key at O(hashicorp_deb_gpgkey_url) is ASCII-armored
          - Selects the .asc or .gpg keyring name apt requires for that format
        type: bool
        required: false
        default: true

      hashicorp_deb_gpgkey_checksum:
        description:
          - Checksum in algo:hash format for O(hashicorp_deb_gpgkey_url)
          - Set to an empty string to skip verification
        type: str
        required: false
