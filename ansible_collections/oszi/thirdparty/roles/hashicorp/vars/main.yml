---
hashicorp_rpm_gpgkey_path: "/etc/pki/rpm-gpg/RPM-GPG-KEY-hashicorp"
hashicorp_rpm_repo_path: "/etc/yum.repos.d/hashicorp.repo"
hashicorp_rpm_includepkgs:
  - boundary
  - consul
  - consul-template
  - consul-terraform-sync
  - nomad
  - packer
  - terraform
  - terraform-ls
  - vagrant
  - vault
  - waypoint

hashicorp_rpm_repo_args:
  file: "{{ (hashicorp_rpm_repo_path | basename).removesuffix('.repo') }}"
  name: "hashicorp"
  description: "Hashicorp Stable - $basearch"
  includepkgs: "{{ hashicorp_rpm_includepkgs }}"
  baseurl: "{{ hashicorp_rpm_baseurl }}/stable"
  gpgkey: "file://{{ hashicorp_rpm_gpgkey_path }}"
  gpgcheck: true
  repo_gpgcheck: false
  enabled: true

hashicorp_rpm_repo_test_args:
  file: "{{ (hashicorp_rpm_repo_path | basename).removesuffix('.repo') }}"
  name: "hashicorp-test"
  description: "Hashicorp Test - $basearch"
  includepkgs: "{{ hashicorp_rpm_includepkgs }}"
  baseurl: "{{ hashicorp_rpm_baseurl }}/test"
  gpgkey: "file://{{ hashicorp_rpm_gpgkey_path }}"
  gpgcheck: true
  repo_gpgcheck: false
  enabled: false

hashicorp_deb_gpgkey_path: "/etc/apt/keyrings/hashicorp.{{ hashicorp_deb_gpgkey_armored | ternary('asc', 'gpg') }}"
hashicorp_deb_absent_paths:
  - "/etc/apt/keyrings/hashicorp.{{ hashicorp_deb_gpgkey_armored | ternary('gpg', 'asc') }}"
  - "/etc/apt/sources.list.d/hashicorp.list"

hashicorp_deb_repo_path: "/etc/apt/sources.list.d/hashicorp.sources"
hashicorp_deb_repo: |
  Types: deb
  URIs: {{ hashicorp_deb_baseurl }}
  Suites: {{ ansible_facts.distribution_release }}
  Components: main
  Signed-By: {{ hashicorp_deb_gpgkey_path }}
