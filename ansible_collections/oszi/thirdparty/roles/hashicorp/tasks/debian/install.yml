---
- name: Ensure directory for Hashicorp deb signing key
  ansible.builtin.file:
    path: "{{ hashicorp_deb_gpgkey_path | dirname }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: Download Hashicorp deb signing key
  ansible.builtin.get_url:
    url: "{{ hashicorp_deb_gpgkey_url }}"
    dest: "{{ hashicorp_deb_gpgkey_path }}"
    checksum: "{{ hashicorp_deb_gpgkey_checksum }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: _hashicorp_deb_gpgkey_result

- name: Remove unmanaged Hashicorp deb files
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items: "{{ hashicorp_deb_absent_paths }}"
  register: _hashicorp_deb_cleanup_result

- name: Install Hashicorp deb repository
  ansible.builtin.copy:
    dest: "{{ hashicorp_deb_repo_path }}"
    content: "{{ hashicorp_deb_repo }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: _hashicorp_deb_repo_result

- name: Update apt cache
  when: _hashicorp_deb_gpgkey_result.changed or _hashicorp_deb_cleanup_result.changed
    or _hashicorp_deb_repo_result.changed
  ansible.builtin.apt:
    update_cache: true
