---
- name: Download Hashicorp RPM signing key
  ansible.builtin.get_url:
    url: "{{ hashicorp_rpm_gpgkey_url }}"
    dest: "{{ hashicorp_rpm_gpgkey_path }}"
    checksum: "{{ hashicorp_rpm_gpgkey_checksum }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Install Hashicorp RPM repository
  ansible.builtin.yum_repository:
  args: "{{ hashicorp_rpm_repo_args }}"

- name: Install Hashicorp test RPM repository
  ansible.builtin.yum_repository:
  args: "{{ hashicorp_rpm_repo_test_args }}"
