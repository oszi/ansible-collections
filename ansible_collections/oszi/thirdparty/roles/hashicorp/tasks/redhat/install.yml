---
- name: Download Hashicorp RPM signing key
  ansible.builtin.get_url:
    url: "{{ hashicorp_rpm_gpgkey_url }}"
    dest: "{{ hashicorp_rpm_gpgkey_path }}"
    checksum: "{{ hashicorp_rpm_gpgkey_checksum | default(omit, true) }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Install Hashicorp RPM repository
  ansible.builtin.yum_repository:
    file: "hashicorp"
    name: "hashicorp"
    description: "Hashicorp Stable - $basearch"
    includepkgs: "{{ hashicorp_rpm_includepkgs }}"
    baseurl: "{{ hashicorp_rpm_baseurl }}/stable"
    gpgkey: "file://{{ hashicorp_rpm_gpgkey_path }}"
    gpgcheck: true
    repo_gpgcheck: false
    enabled: true

- name: Install Hashicorp test RPM repository
  ansible.builtin.yum_repository:
    file: "hashicorp"
    name: "hashicorp-test"
    description: "Hashicorp Test - $basearch"
    includepkgs: "{{ hashicorp_rpm_includepkgs }}"
    baseurl: "{{ hashicorp_rpm_baseurl }}/test"
    gpgkey: "file://{{ hashicorp_rpm_gpgkey_path }}"
    gpgcheck: true
    repo_gpgcheck: false
    enabled: false
