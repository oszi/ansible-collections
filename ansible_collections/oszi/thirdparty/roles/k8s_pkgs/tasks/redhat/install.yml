---
- name: Download Kubernetes rpm signing key
  ansible.builtin.get_url:
    url: "{{ k8s_pkgs_rpm_gpgkey_url }}"
    dest: "{{ k8s_pkgs_rpm_gpgkey_path }}"
    checksum: "{{ k8s_pkgs_rpm_gpgkey_checksum }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Install Kubernetes RPM repository
  ansible.builtin.yum_repository:
  args: "{{ k8s_pkgs_rpm_repo_args }}"
