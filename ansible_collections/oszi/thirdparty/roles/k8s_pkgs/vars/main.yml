---
k8s_pkgs_rpm_repo_path: "/etc/yum.repos.d/kubernetes.repo"
k8s_pkgs_rpm_gpgkey_path: "/etc/pki/rpm-gpg/RPM-GPG-KEY-kubernetes"
k8s_pkgs_rpm_includepkgs:
  - "kube*"
  - "cri-tools"

k8s_pkgs_rpm_repo_args:
  file: "{{ (k8s_pkgs_rpm_repo_path | basename).removesuffix('.repo') }}"
  name: "kubernetes"
  description: "Kubernetes community packages"
  includepkgs: "{{ k8s_pkgs_rpm_includepkgs }}"
  baseurl: "{{ k8s_pkgs_rpm_baseurl }}"
  gpgkey: "file://{{ k8s_pkgs_rpm_gpgkey_path }}"
  gpgcheck: true
  repo_gpgcheck: false
  enabled: true

k8s_pkgs_deb_gpgkey_path: "/etc/apt/keyrings/kubernetes-apt-keyring.{{ k8s_pkgs_deb_gpgkey_armored | ternary('asc', 'gpg') }}"
k8s_pkgs_deb_absent_paths:
  - "/etc/apt/keyrings/kubernetes-apt-keyring.{{ k8s_pkgs_deb_gpgkey_armored | ternary('gpg', 'asc') }}"
  - "/etc/apt/sources.list.d/kubernetes.list"

k8s_pkgs_deb_repo_path: "/etc/apt/sources.list.d/kubernetes.sources"
k8s_pkgs_deb_repo: |
  Types: deb
  URIs: {{ k8s_pkgs_deb_baseurl }}
  Suites: /
  Signed-By: {{ k8s_pkgs_deb_gpgkey_path }}

k8s_pkgs_deb_preferences_path: "/etc/apt/preferences.d/kubernetes"
k8s_pkgs_deb_preferences: |
  Package: kube*
  Pin: origin {{ k8s_pkgs_deb_baseurl | ansible.builtin.urlsplit('hostname') }}
  Pin-Priority: 1001

# Used to enable completions in post-setup tasks.
# Joined as string to support version pinned packages.
k8s_pkgs_kubectl_enabled: "{{ 'kubectl' in ' '.join(k8s_pkgs_packages | flatten) }}"
k8s_pkgs_kubeadm_enabled: "{{ 'kubeadm' in ' '.join(k8s_pkgs_packages | flatten) }}"
