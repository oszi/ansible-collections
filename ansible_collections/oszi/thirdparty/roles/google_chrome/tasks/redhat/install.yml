---
- name: Download Google Chrome RPM signing key
  ansible.builtin.get_url:
    url: "{{ google_chrome_rpm_gpgkey_url }}"
    dest: "{{ google_chrome_rpm_gpgkey_path }}"
    checksum: "{{ google_chrome_rpm_gpgkey_checksum | default(omit, true) }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Remove unmanaged Google Chrome RPM files
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items: "{{ google_chrome_rpm_absent_paths }}"

- name: Install Google Chrome RPM repository
  ansible.builtin.yum_repository:
  args: "{{ google_chrome_rpm_repo_args }}"
