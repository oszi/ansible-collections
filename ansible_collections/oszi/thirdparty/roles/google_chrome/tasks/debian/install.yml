---
- name: Ensure directory for Google Chrome deb signing key
  ansible.builtin.file:
    path: "{{ google_chrome_deb_gpgkey_path | dirname }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: Download Google Chrome deb signing key
  ansible.builtin.get_url:
    url: "{{ google_chrome_deb_gpgkey_url }}"
    dest: "{{ google_chrome_deb_gpgkey_path }}"
    checksum: "{{ google_chrome_deb_gpgkey_checksum | default(omit, true) }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: _google_chrome_deb_gpgkey_result

- name: Remove unmanaged Google Chrome deb files
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items: "{{ google_chrome_deb_absent_paths }}"
  register: _google_chrome_deb_cleanup_result

- name: Install Google Chrome deb repository
  ansible.builtin.copy:
    dest: "{{ google_chrome_deb_repo_path }}"
    content: "{{ google_chrome_deb_repo }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: _google_chrome_deb_repo_result

- name: Update apt cache
  when: _google_chrome_deb_gpgkey_result.changed or _google_chrome_deb_cleanup_result.changed
    or _google_chrome_deb_repo_result.changed
  ansible.builtin.apt:
    update_cache: true
