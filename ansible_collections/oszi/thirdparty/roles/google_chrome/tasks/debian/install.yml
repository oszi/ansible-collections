---
- name: Ensure directory for Google Chrome deb signing key
  ansible.builtin.file:
    path: "{{ google_chrome_deb_gpgkey_path | dirname }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: Copy Google Chrome deb signing key
  ansible.builtin.copy:
    src: "{{ google_chrome_deb_gpgkey_path.lstrip('/') }}"
    dest: "{{ google_chrome_deb_gpgkey_path }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Remove legacy and vendor-managed Google Chrome deb repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items:
    - "{{ google_chrome_deb_gpgkey_legacy_path }}"
    - "{{ google_chrome_deb_repo_legacy_path }}"
    - "{{ google_chrome_deb_repo_vendored_path }}"
  register: _google_chrome_deb_cleanup_result

- name: Install Google Chrome deb repository
  ansible.builtin.copy:
    dest: "{{ google_chrome_deb_repo_path }}"
    content: "{{ google_chrome_deb_repo }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: _google_chrome_deb_repo_result

- name: Update apt cache
  when: _google_chrome_deb_cleanup_result.changed or _google_chrome_deb_repo_result.changed
  ansible.builtin.apt:
    update_cache: true
