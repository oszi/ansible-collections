---
argument_specs:
  main:
    short_description: Google Chrome browser installation
    description:
      - Manages Google Chrome installation from Google's official repositories for Debian and RedHat systems
      - Manages the repository under a different filename from upstream and disables vendor repository management
      - Supports custom repository mirrors
    author:
      - "David O. (oszi.dev)"
    options:
      google_chrome_enabled:
        description:
          - Whether to install or uninstall Google Chrome
          - Disabled by default
        type: bool
        required: false
        default: false

      google_chrome_rpm_baseurl:
        description:
          - Base URL for the Google Chrome RPM repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      google_chrome_deb_baseurl:
        description:
          - Base URL for the Google Chrome Debian/Ubuntu repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      google_chrome_rpm_gpgkey_url:
        description:
          - URL of the GPG public key for the Google Chrome RPM repository
          - Google publishes one signing key for both package formats
          - Change for custom mirrors or proxies
        type: str
        required: false

      google_chrome_rpm_gpgkey_checksum:
        description:
          - Checksum in algo:hash format for O(google_chrome_rpm_gpgkey_url)
          - Set to an empty string to skip verification
        type: str
        required: false

      google_chrome_deb_gpgkey_url:
        description:
          - URL of the GPG public key for the Google Chrome Debian/Ubuntu repository
          - Google publishes one signing key for both package formats
          - Change for custom mirrors or proxies
        type: str
        required: false

      google_chrome_deb_gpgkey_armored:
        description:
          - Whether the key at O(google_chrome_deb_gpgkey_url) is ASCII-armored
          - Selects the .asc or .gpg keyring name apt requires for that format
        type: bool
        required: false
        default: true

      google_chrome_deb_gpgkey_checksum:
        description:
          - Checksum in algo:hash format for O(google_chrome_deb_gpgkey_url)
          - Set to an empty string to skip verification
        type: str
        required: false

      google_chrome_deb_arch:
        description:
          - Space or comma-separated list of Debian repository architectures to enable
        type: str
        required: false
