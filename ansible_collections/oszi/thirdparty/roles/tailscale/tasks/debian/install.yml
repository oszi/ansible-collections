---
- name: Ensure directory for Tailscale deb signing key
  ansible.builtin.file:
    path: "{{ tailscale_deb_gpgkey_path | dirname }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: Download Tailscale deb signing key
  ansible.builtin.get_url:
    url: "{{ tailscale_deb_gpgkey_url }}"
    dest: "{{ tailscale_deb_gpgkey_path }}"
    checksum: "{{ tailscale_deb_gpgkey_checksum }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: _tailscale_deb_gpgkey_result

- name: Remove unmanaged Tailscale deb files
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items: "{{ tailscale_deb_absent_paths }}"
  register: _tailscale_deb_cleanup_result

- name: Install Tailscale deb repository
  ansible.builtin.copy:
    dest: "{{ tailscale_deb_repo_path }}"
    content: "{{ tailscale_deb_repo }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: _tailscale_deb_repo_result

- name: Update apt cache
  when: _tailscale_deb_gpgkey_result.changed or _tailscale_deb_cleanup_result.changed
    or _tailscale_deb_repo_result.changed
  ansible.builtin.apt:
    update_cache: true
