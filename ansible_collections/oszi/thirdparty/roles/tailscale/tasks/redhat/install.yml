---
- name: Download Tailscale RPM signing key
  ansible.builtin.get_url:
    url: "{{ tailscale_rpm_gpgkey_url }}"
    dest: "{{ tailscale_rpm_gpgkey_path }}"
    checksum: "{{ tailscale_rpm_gpgkey_checksum }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Install Tailscale RPM repository
  ansible.builtin.yum_repository:
  args: "{{ tailscale_rpm_repo_args }}"
