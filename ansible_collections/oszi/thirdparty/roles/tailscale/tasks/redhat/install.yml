---
- name: Download Tailscale RPM signing key
  ansible.builtin.get_url:
    url: "{{ tailscale_rpm_gpgkey_url }}"
    dest: "{{ tailscale_rpm_gpgkey_path }}"
    checksum: "{{ tailscale_rpm_gpgkey_checksum | default(omit, true) }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Install Tailscale RPM repository
  ansible.builtin.yum_repository:
    file: "tailscale"
    name: "tailscale"
    description: "Tailscale stable"
    includepkgs: "{{ tailscale_rpm_includepkgs }}"
    baseurl: "{{ tailscale_rpm_baseurl }}"
    gpgkey: "file://{{ tailscale_rpm_gpgkey_path }}"
    gpgcheck: true
    repo_gpgcheck: false
    enabled: true
