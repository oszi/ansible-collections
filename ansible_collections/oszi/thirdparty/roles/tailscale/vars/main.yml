---
tailscale_rpm_gpgkey_path: "/etc/pki/rpm-gpg/RPM-GPG-KEY-tailscale"
tailscale_rpm_repo_path: "/etc/yum.repos.d/tailscale.repo"
tailscale_rpm_includepkgs:
  - "tailscale"

tailscale_deb_gpgkey_path: "/etc/apt/keyrings/tailscale-archive-keyring.{{ tailscale_deb_gpgkey_armored | ternary('asc', 'gpg') }}"
tailscale_deb_absent_paths:
  - "/etc/apt/keyrings/tailscale-archive-keyring.{{ tailscale_deb_gpgkey_armored | ternary('gpg', 'asc') }}"
  - "/etc/apt/sources.list.d/tailscale.list"
  # - "/usr/share/keyrings/tailscale-archive-keyring.gpg"

tailscale_deb_repo_path: "/etc/apt/sources.list.d/tailscale.sources"
tailscale_deb_repo: |
  Types: deb
  URIs: {{ tailscale_deb_baseurl }}
  Suites: {{ ansible_facts.distribution_release }}
  Components: main
  Signed-By: {{ tailscale_deb_gpgkey_path }}

# Path for tailscale_systemd_service_override:
tailscale_systemd_service_override_path: "/etc/systemd/system/tailscaled.service.d/override.conf"

# Files created by post-setup tasks - used by uninstall tasks:
tailscale_post_setup_files:
  - "{{ tailscale_systemd_service_override_path }}"
  - "{{ tailscale_bash_completion_path }}"
  - "{{ tailscale_zsh_completion_path }}"
