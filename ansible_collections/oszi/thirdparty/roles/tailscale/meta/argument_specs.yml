---
argument_specs:
  main:
    short_description: Tailscale VPN mesh installation
    description:
      - Installs Tailscale VPN mesh software
      - Supports upstream repositories and distribution packages
      - Supports tailscaled systemd service customization via drop-in overrides
    author:
      - "David O. (oszi.dev)"
    options:
      tailscale_enabled:
        description:
          - Whether to install or uninstall Tailscale VPN software
          - Disabled by default
        type: bool
        required: false
        default: false

      tailscale_upstream_enabled:
        description:
          - Whether to install the upstream/external deb/rpm repository
          - Automatically enabled when tailscale_enabled is true except on Fedora
          - Fedora has native tailscale package in its repositories
        type: bool
        required: false

      tailscale_rpm_baseurl:
        description:
          - Base URL for the Tailscale RPM repository
          - Automatically adjusts path based on distribution (Fedora vs RHEL)
          - Change for custom mirrors or proxies
        type: str
        required: false

      tailscale_deb_baseurl:
        description:
          - Base URL for the Tailscale Debian/Ubuntu repository
          - Change for custom mirrors or proxies
        type: str
        required: false

      tailscale_rpm_gpgkey_url:
        description:
          - URL of the GPG public key for the Tailscale RPM repository
          - Automatically adjusts path based on distribution (Fedora vs RHEL)
          - Change for custom mirrors or proxies
        type: str
        required: false

      tailscale_rpm_gpgkey_checksum:
        description:
          - Checksum in algo:hash format for O(tailscale_rpm_gpgkey_url)
          - Set to an empty string to skip verification
        type: str
        required: false

      tailscale_deb_gpgkey_url:
        description:
          - URL of the GPG public key for the Tailscale Debian/Ubuntu repository
          - Automatically adjusts path based on distribution and release
          - The key is identical for every supported release
          - Change for custom mirrors or proxies
        type: str
        required: false

      tailscale_deb_gpgkey_armored:
        description:
          - Whether the key at O(tailscale_deb_gpgkey_url) is ASCII-armored
          - Selects the .asc or .gpg keyring name apt requires for that format
        type: bool
        required: false
        default: false

      tailscale_deb_gpgkey_checksum:
        description:
          - Checksum in algo:hash format for O(tailscale_deb_gpgkey_url)
          - Set to an empty string to skip verification
        type: str
        required: false

      tailscale_systemd_service_override:
        description:
          - Systemd service drop-in content for tailscaled daemon
          - Use to set environment variables like PORT=443 or FLAGS (upstream)
          - Clear EnvironmentFile= for cross-distribution compatibility
          - /etc/default/tailscaled is not present on every system (e.g., Fedora)
        type: str
        required: false

      tailscale_bash_completion_path:
        description:
          - System path for tailscale bash completion script
        type: path
        required: false
        default: /etc/bash_completion.d/tailscale

      tailscale_zsh_completion_path:
        description:
          - System path for tailscale ZSH completion script
          - ZSH-native, auto-loading works from site-functions
        type: path
        required: false
        default: /usr/local/share/zsh/site-functions/_tailscale
