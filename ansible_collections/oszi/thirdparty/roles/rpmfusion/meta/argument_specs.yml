---
argument_specs:
  main:
    short_description: RPM Fusion repository configuration for RHEL and Fedora
    description:
      - Manages RPM Fusion free and nonfree repositories on RedHat family distributions
      - Installs the upstream release packages, verified with the signing keys from the distribution-gpg-keys
        package of Fedora or EPEL; installs EPEL on RedHat family distributions other than Fedora
      - Supports allowerasing for package replacements (e.g., ffmpeg-free to ffmpeg)
    author:
      - "David O. (oszi.dev)"
    options:
      rpmfusion_enabled:
        description:
          - Whether to install or uninstall RPM Fusion repositories and packages on RedHat family distributions
          - If disabled, also removes Fedora's pre-installed RPM Fusion subset repositories
          - Disabled by default
        type: bool
        required: false
        default: false

      rpmfusion_tainted_enabled:
        description:
          - Whether to install the tainted repositories, which carry legally restricted software (e.g., libdvdcss)
          - Removed when disabled; requires O(rpmfusion_enabled); ignored when the tainted release packages are listed
            in O(rpmfusion_packages) or O(rpmfusion_blacklisted_packages), which take precedence
        type: bool
        required: false
        default: false

      rpmfusion_dnf_allowerasing:
        description:
          - Whether to run dnf with --allowerasing flag
          - Allows replacing packages like ffmpeg-free with full ffmpeg from RPM Fusion
          - Use with caution as it can remove conflicting packages
        type: bool
        required: false
        default: false

      rpmfusion_bootstrap_mirror:
        description:
          - Base URL of the mirror serving the signed release RPM files, used to bootstrap the repositories
          - The repository files ship their own metalink; use oszi.general.package_manager replacements for mirrors,
            but beware of the chicken-and-egg problem
        type: str
        required: false

      rpmfusion_packages:
        description:
          - Nested list of RPM Fusion package names to install
          - Can include multimedia codecs, drivers, and proprietary software
        type: list
        elements: raw
        required: false

      rpmfusion_blacklisted_packages:
        description:
          - Nested list of RPM Fusion package names to always uninstall
        type: list
        elements: raw
        required: false
