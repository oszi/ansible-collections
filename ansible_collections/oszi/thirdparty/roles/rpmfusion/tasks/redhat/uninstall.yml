---
- name: Ensure RPM Fusion release, tainted, and appstream packages are absent
  ansible.builtin.dnf:
    name: "{{ rpmfusion_rpm_release_list | map(attribute='name') | list
      + rpmfusion_rpm_release_tainted_packages + rpmfusion_rpm_appstream_packages }}"
    state: "absent"

- name: Find leftover RPM Fusion repository files
  ansible.builtin.find:
    paths:
      - "/etc/yum.repos.d"
      - "/etc/pki/rpm-gpg"
    pattern: "*rpmfusion*"
    file_type: "any"
  register: _rpmfusion_leftovers_found

- name: Remove leftover RPM Fusion repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items: "{{ _rpmfusion_leftovers_found.files | map(attribute='path') }}"
