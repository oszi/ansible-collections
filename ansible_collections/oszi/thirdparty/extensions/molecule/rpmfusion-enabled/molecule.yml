---
# Molecule scenario for oszi.thirdparty.rpmfusion with rpmfusion_enabled: true.
# Needs network access to mirrors.rpmfusion.org on Fedora; the role is a no-op on the Debian family,
# which the idempotence step and the absence checks cover there. Tainted repositories stay disabled.
provisioner:
  inventory:
    group_vars:
      all:
        rpmfusion_enabled: true
      fedora:
        # The role manages the tainted repositories through their release packages only; nothing to seed.
        molecule_seed_paths: []
        # The release packages own the repository files, under /etc/yum.repos.d up to Fedora 44 and under
        # /usr/share/dnf5/repos.d since Fedora 45; rpm -V proves they are present and intact either way.
        molecule_verify_commands:
          - {cmd: "rpm -q rpmfusion-free-release rpmfusion-nonfree-release"}
          - {cmd: "rpm -V rpmfusion-free-release rpmfusion-nonfree-release"}
          - {cmd: "! dnf5 repo list --all | grep -q tainted"}
          # Both signing keys were imported from distribution-gpg-keys before the release packages.
          - {cmd: "rpm -q gpg-pubkey --qf '%{SUMMARY}\\n' | grep -c 'RPM Fusion'", stdout: "2"}
          - {cmd: "dnf5 repo list --enabled", stdout_contains: "rpmfusion-nonfree-updates"}
        molecule_verify_packages:
          present: [distribution-gpg-keys, rpmfusion-free-release, rpmfusion-nonfree-release]
          absent: [rpmfusion-free-release-tainted, rpmfusion-nonfree-release-tainted]
      debian:
        molecule_verify_commands:
          - {cmd: "! grep -rqi rpmfusion /etc/apt"}
