---
# Molecule scenario for oszi.thirdparty.gcloud_sdk installing google-cloud-cli from Google.
# Needs network access to packages.cloud.google.com; google-cloud-cli is a large download.
# The GKE auth plugin exercises a component package; the other components stay disabled.
# Prepare seeds the legacy files the install path removes and, on RPM, the managed repository file
# with a disabled main section and the obsolete unstable section the role must rewrite and drop.
provisioner:
  inventory:
    group_vars:
      all:
        # The default is false in containers.
        gcloud_sdk_enabled: true
        gcloud_sdk_gke_auth_plugin_enabled: true
        molecule_prepare_seed_verify_absent: true
        molecule_verify_role_defaults_file: "${MOLECULE_PROJECT_DIRECTORY}/roles/gcloud_sdk/defaults/main.yml"
        molecule_verify_paths: "{{ molecule_verify_paths_common + molecule_verify_paths_distro }}"
        molecule_verify_paths_common:
          - {path: /usr/local/bin/gcloud-entrypoint.sh, mode: "0755", owner: root}
        molecule_verify_commands: "{{ molecule_verify_commands_common + molecule_verify_commands_distro }}"
        molecule_verify_commands_common:
          - {cmd: "gcloud --version", stdout_contains: "Google Cloud SDK"}
          - {cmd: "bash -n /usr/local/bin/gcloud-entrypoint.sh"}
        molecule_verify_packages:
          present: [google-cloud-cli, google-cloud-cli-gke-gcloud-auth-plugin]
          absent:
            - google-cloud-cli-minikube
            - google-cloud-cli-bigtable-emulator
            - google-cloud-cli-app-engine-go
      redhat:
        # Disabled sections keep dnf from fetching the seeded repository in the converge cache refresh.
        molecule_prepare_seed_files:
          - path: /etc/yum.repos.d/google-cloud-sdk.repo
            content: |
              [google-cloud-sdk]
              name=GCloud SDK
              baseurl=https://packages.cloud.google.com/yum/repos/cloud-sdk-el10-$$basearch
              enabled=0
              gpgcheck=1
              gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-google-cloud-sdk

              [google-cloud-sdk-unstable]
              name=GCloud SDK Unstable
              baseurl=https://packages.cloud.google.com/yum/repos/cloud-sdk-el10-$$basearch-unstable
              enabled=0
              gpgcheck=1
              gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-google-cloud-sdk
        molecule_verify_paths_distro:
          # The repository is the EL 10 one on every RPM distribution, Fedora included.
          - path: /etc/yum.repos.d/google-cloud-sdk.repo
            mode: "0644"
            owner: root
            group: root
            lines:
              - "[google-cloud-sdk]"
              - "baseurl = {{ molecule_role_defaults.gcloud_sdk_rpm_baseurl }}"
              - "includepkgs = google-cloud-*"
              - "gpgkey = file:///etc/pki/rpm-gpg/RPM-GPG-KEY-google-cloud-sdk"
              - "gpgcheck = 1"
              - "enabled = 1"
          - path: /etc/pki/rpm-gpg/RPM-GPG-KEY-google-cloud-sdk
            mode: "0644"
            owner: root
            group: root
            checksum: "{{ molecule_role_defaults.gcloud_sdk_rpm_gpgkey_checksum }}"
        molecule_verify_commands_distro:
          - {cmd: "! grep -F '[google-cloud-sdk-unstable]' /etc/yum.repos.d/google-cloud-sdk.repo"}
          - {cmd: "dnf repoquery --installed --qf '%{from_repo}\\n' google-cloud-cli", stdout: google-cloud-sdk}
      debian:
        molecule_verify_paths_distro:
          - path: /etc/apt/sources.list.d/google-cloud-sdk.sources
            mode: "0644"
            owner: root
            group: root
            lines:
              - "URIs: {{ molecule_role_defaults.gcloud_sdk_deb_baseurl }}"
              - "Suites: cloud-sdk"
              - "Components: main"
              - "Signed-By: /etc/apt/keyrings/google-cloud-sdk.asc"
          - path: /etc/apt/keyrings/google-cloud-sdk.asc
            mode: "0644"
            owner: root
            group: root
            checksum: "{{ molecule_role_defaults.gcloud_sdk_deb_gpgkey_checksum }}"
          - {path: /etc/apt/keyrings/google-cloud-sdk.gpg, state: absent}
          - {path: /etc/apt/sources.list.d/google-cloud-sdk.list, state: absent}
          - {path: /etc/apt/sources.list.d/gce_sdk.list, state: absent}
        molecule_verify_commands_distro:
          - {cmd: "apt-cache policy google-cloud-cli | grep -A1 -F '***' | grep -F packages.cloud.google.com"}
