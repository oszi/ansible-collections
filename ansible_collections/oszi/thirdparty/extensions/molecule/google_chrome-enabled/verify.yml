---
# Google's daily cron job re-adds the vendor repository unless /etc/default/google-chrome disables it;
# it runs before the shared assertions so the vendor repository files are checked after it.
- name: Run the Google Chrome cron job
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the daily Google Chrome cron job
      ansible.builtin.command:
        cmd: "/etc/cron.daily/google-chrome"
      changed_when: false

- name: Import the shared verify playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.verify
