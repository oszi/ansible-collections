---
# Molecule scenario for oszi.thirdparty.google_chrome installing google-chrome-stable (amd64 only).
# Needs network access to dl.google.com and dl-ssl.google.com.
# Prepare seeds the vendor-written files under their fixed names; the install path removes them,
# and neither the package scripts nor the daily cron job (run in verify.yml) may add them back.
provisioner:
  inventory:
    group_vars:
      all:
        google_chrome_enabled: true
        molecule_prepare_seed_verify_absent: true
        molecule_verify_role_defaults_file: "${MOLECULE_PROJECT_DIRECTORY}/roles/google_chrome/defaults/main.yml"
        molecule_verify_paths: "{{ molecule_verify_paths_common + molecule_verify_paths_distro }}"
        molecule_verify_paths_common:
          - path: /etc/default/google-chrome
            mode: "0644"
            owner: root
            group: root
            content: "repo_add_once=\"false\"\nrepo_reenable_on_distupgrade=\"false\"\n"
        molecule_verify_commands: "{{ molecule_verify_commands_common + molecule_verify_commands_distro }}"
        molecule_verify_commands_common:
          # Prints the version without starting the browser.
          - {cmd: "google-chrome-stable --version", stdout_contains: "Google Chrome"}
        molecule_verify_packages:
          present: [google-chrome-stable]
          absent: [google-chrome-beta, google-chrome-unstable]
      redhat:
        molecule_verify_paths_distro:
          - path: /etc/yum.repos.d/google-chrome-ansible-managed.repo
            mode: "0644"
            owner: root
            group: root
            lines:
              - "[google-chrome]"
              - "baseurl = {{ molecule_role_defaults.google_chrome_rpm_baseurl }}"
              - "includepkgs = google-chrome-beta google-chrome-stable google-chrome-unstable"
              - "gpgkey = file:///etc/pki/rpm-gpg/RPM-GPG-KEY-google-chrome"
              - "gpgcheck = 1"
              - "enabled = 1"
          - path: /etc/pki/rpm-gpg/RPM-GPG-KEY-google-chrome
            mode: "0644"
            owner: root
            group: root
            checksum: "{{ molecule_role_defaults.google_chrome_rpm_gpgkey_checksum }}"
          - {path: /etc/yum.repos.d/google-chrome.repo, state: absent}
        molecule_verify_commands_distro:
          - {cmd: "dnf repoquery --installed --qf '%{from_repo}\\n' google-chrome-stable", stdout: google-chrome}
      debian:
        molecule_verify_paths_distro:
          - path: /etc/apt/sources.list.d/google-chrome-ansible-managed.sources
            mode: "0644"
            owner: root
            group: root
            lines:
              - "URIs: {{ molecule_role_defaults.google_chrome_deb_baseurl }}"
              - "Suites: stable"
              - "Components: main"
              - "Architectures: {{ molecule_role_defaults.google_chrome_deb_arch }}"
              - "Signed-By: /etc/apt/keyrings/google-chrome.asc"
          - path: /etc/apt/keyrings/google-chrome.asc
            mode: "0644"
            owner: root
            group: root
            checksum: "{{ molecule_role_defaults.google_chrome_deb_gpgkey_checksum }}"
          - {path: /etc/apt/keyrings/google-chrome.gpg, state: absent}
          - {path: /etc/apt/sources.list.d/google-chrome.sources, state: absent}
          - {path: /etc/apt/sources.list.d/google-chrome.list, state: absent}
          - {path: /etc/apt/trusted.gpg.d/google-chrome.gpg, state: absent}
        molecule_verify_commands_distro:
          - {cmd: "apt-cache policy google-chrome-stable | grep -A1 -F '***' | grep -F dl-ssl.google.com"}
