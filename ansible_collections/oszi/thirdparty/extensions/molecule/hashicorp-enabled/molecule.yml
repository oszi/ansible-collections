---
# Molecule scenario for oszi.thirdparty.hashicorp with the repository only (hashicorp_packages: []).
# Needs network access to rpm.releases.hashicorp.com and apt.releases.hashicorp.com.
# Prepare seeds the legacy deb files the install path removes. verify.yml gathers facts first:
# the expected baseurl and suite follow the distribution.
provisioner:
  inventory:
    group_vars:
      all:
        hashicorp_enabled: true
        molecule_prepare_seed_verify_absent: true
        molecule_verify_role_defaults_file: "${MOLECULE_PROJECT_DIRECTORY}/roles/hashicorp/defaults/main.yml"
      redhat:
        molecule_verify_paths:
          # Both sections in one file; the test repository stays disabled.
          - path: /etc/yum.repos.d/hashicorp.repo
            mode: "0644"
            owner: root
            group: root
            lines:
              - "[hashicorp]"
              - "[hashicorp-test]"
              - "baseurl = {{ molecule_role_defaults.hashicorp_rpm_baseurl }}/stable"
              - "baseurl = {{ molecule_role_defaults.hashicorp_rpm_baseurl }}/test"
              - "includepkgs = boundary consul consul-template consul-terraform-sync nomad packer terraform
                terraform-ls vagrant vault waypoint"
              - "gpgkey = file:///etc/pki/rpm-gpg/RPM-GPG-KEY-hashicorp"
              - "gpgcheck = 1"
          - path: /etc/pki/rpm-gpg/RPM-GPG-KEY-hashicorp
            mode: "0644"
            owner: root
            group: root
            checksum: "{{ molecule_role_defaults.hashicorp_rpm_gpgkey_checksum }}"
        molecule_verify_commands:
          - {cmd: "dnf repolist --enabled | grep -E '^hashicorp[[:space:]]'"}
          - {cmd: "! dnf repolist --enabled | grep -E '^hashicorp-test[[:space:]]'"}
          # The repository metadata for this Fedora release loads and lists the packages.
          - {cmd: "dnf makecache --repo hashicorp"}
          - {cmd: "dnf repoquery --repo hashicorp --latest-limit 1 --qf '%{name}\\n' terraform", stdout: terraform}
        molecule_verify_packages:
          absent: [terraform]
      debian:
        molecule_verify_paths:
          - path: /etc/apt/sources.list.d/hashicorp.sources
            mode: "0644"
            owner: root
            group: root
            lines:
              - "URIs: {{ molecule_role_defaults.hashicorp_deb_baseurl }}"
              # Suites follow the distribution codename.
              - "Suites: {{ ansible_facts.distribution_release }}"
              - "Components: main"
              - "Signed-By: /etc/apt/keyrings/hashicorp.asc"
          - path: /etc/apt/keyrings/hashicorp.asc
            mode: "0644"
            owner: root
            group: root
            checksum: "{{ molecule_role_defaults.hashicorp_deb_gpgkey_checksum }}"
          - {path: /etc/apt/keyrings/hashicorp.gpg, state: absent}
          - {path: /etc/apt/sources.list.d/hashicorp.list, state: absent}
        molecule_verify_commands:
          # Update from this source only; signature or missing-suite problems surface as W: or E: lines.
          - cmd: "out=\"$$(apt-get update -o Dir::Etc::SourceList=/etc/apt/sources.list.d/hashicorp.sources
              -o Dir::Etc::SourceParts=- 2>&1)\" && ! grep -E '^(W|E):' <<<\"$$out\""
          - {cmd: "apt-cache madison terraform | grep -F apt.releases.hashicorp.com"}
        molecule_verify_packages:
          absent: [terraform]
