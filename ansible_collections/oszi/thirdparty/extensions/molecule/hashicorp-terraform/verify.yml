---
# The expected repository lines are templated from the role defaults and the distribution facts.
- name: Gather facts for the shared assertions
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Import facts role
      ansible.builtin.import_role:
        name: oszi.utils.facts

- name: Import the shared verify playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.verify
