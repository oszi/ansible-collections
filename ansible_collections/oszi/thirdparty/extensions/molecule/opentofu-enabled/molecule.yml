---
# Molecule scenario for oszi.thirdparty.opentofu with opentofu_enabled: true.
# Needs network access to get.opentofu.org and packages.opentofu.org (slow) on Debian and Ubuntu;
# Fedora installs the distribution package and keeps the upstream repository uninstalled.
# Prepare seeds every path listed as absent below, which the role must remove.
# Keyrings must match the role's default checksums and the format their extension promises:
# apt dearmors only .asc keyrings.
provisioner:
  inventory:
    group_vars:
      all:
        opentofu_enabled: true
        molecule_prepare_seed_verify_absent: true
        molecule_verify_role_defaults_file: "${MOLECULE_PROJECT_DIRECTORY}/roles/opentofu/defaults/main.yml"
      redhat:
        # opentofu_upstream_enabled defaults to false on Fedora: the upstream files must be removed.
        molecule_verify_paths:
          - {path: /etc/pki/rpm-gpg/RPM-GPG-KEY-opentofu, state: absent}
          - {path: /etc/pki/rpm-gpg/RPM-GPG-KEY-opentofu-repo, state: absent}
          - {path: /etc/yum.repos.d/opentofu.repo, state: absent}
        molecule_verify_commands:
          - {cmd: "tofu version", stdout_contains: "OpenTofu v"}
          - {cmd: "rpm -q --qf '%{VENDOR}' opentofu", stdout: "Fedora Project"}
        molecule_verify_packages:
          present: [opentofu]
          absent: [tofu]
      debian:
        # The core signing key is published in binary form, the repository host key armored;
        # the keyrings with the other extension and the legacy one-line source are seeded and removed.
        molecule_verify_paths:
          - path: /etc/apt/keyrings/opentofu.gpg
            mode: "0644"
            owner: root
            group: root
            checksum: "{{ molecule_role_defaults.opentofu_deb_gpgkey_checksum }}"
          - path: /etc/apt/keyrings/opentofu-repo.asc
            mode: "0644"
            owner: root
            group: root
            checksum: "{{ molecule_role_defaults.opentofu_deb_repo_gpgkey_checksum }}"
          - path: /etc/apt/sources.list.d/opentofu.sources
            mode: "0644"
            owner: root
            group: root
            content: |
              Types: deb deb-src
              URIs: {{ molecule_role_defaults.opentofu_deb_baseurl }}
              Suites: any
              Components: main
              Signed-By: /etc/apt/keyrings/opentofu.gpg /etc/apt/keyrings/opentofu-repo.asc
          - {path: /etc/apt/keyrings/opentofu.asc, state: absent}
          - {path: /etc/apt/keyrings/opentofu-repo.gpg, state: absent}
          - {path: /etc/apt/sources.list.d/opentofu.list, state: absent}
        molecule_verify_commands:
          - {cmd: "tofu version", stdout_contains: "OpenTofu v"}
          - {cmd: "[ \"$$(head -c 5 /etc/apt/keyrings/opentofu.gpg)\" != \"-----\" ]"}
          - {cmd: "head -c 14 /etc/apt/keyrings/opentofu-repo.asc", stdout: "-----BEGIN PGP"}
          # apt accepts the keyrings and the source without warnings.
          - {cmd: "out=$$(apt-get update 2>&1); ! grep -E '^(W|E):' <<<\"$$out\""}
        molecule_verify_packages:
          present: [tofu]
          absent: [opentofu]
