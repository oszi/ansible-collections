---
- name: Import the shared prepare playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.prepare

# Bootstraps the signing key as google_chrome_manage_repository: false requires from the user; the repository
# files and /etc/default/google-chrome are seeded by the shared prepare. The key checksum is read from the
# role defaults, not duplicated.
- name: Bootstrap the vendor-managed Google Chrome repository
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ molecule_verify_role_defaults_file }}"
        name: "molecule_role_defaults"

    - name: Ensure the signing key directory exists
      ansible.builtin.file:
        path: "{{ molecule_chrome_gpgkey_path | dirname }}"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"

    - name: Download the signing key
      ansible.builtin.get_url:
        url: "https://dl.google.com/linux/linux_signing_key.pub"
        dest: "{{ molecule_chrome_gpgkey_path }}"
        checksum: "{{ molecule_chrome_gpgkey_checksum }}"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: Update the package cache with the bootstrapped repository
      ansible.builtin.package:
        update_cache: true
      changed_when: false
