---
# Molecule scenario for oszi.thirdparty.google_chrome with google_chrome_manage_repository: false (amd64 only).
# The role then only removes its own repository file and installs the package; prepare seeds the repository
# and /etc/default/google-chrome as the user must, prepare.yml downloads the signing key, and the role
# leaves them alone. Needs network access to dl.google.com.
provisioner:
  inventory:
    group_vars:
      all:
        google_chrome_enabled: true
        google_chrome_manage_repository: false
        # Marker line: proves the role does not rewrite a user-provided defaults file.
        molecule_chrome_defaults_content: |
          # bootstrapped by molecule
          repo_add_once="false"
          repo_reenable_on_distupgrade="false"
        molecule_prepare_seed_files: "{{ molecule_prepare_seed_files_common + molecule_prepare_seed_files_distro }}"
        molecule_prepare_seed_files_common:
          - path: /etc/default/google-chrome
            content: "{{ molecule_chrome_defaults_content }}"
        molecule_verify_role_defaults_file: "${MOLECULE_PROJECT_DIRECTORY}/roles/google_chrome/defaults/main.yml"
        molecule_verify_paths: "{{ molecule_verify_paths_common + molecule_verify_paths_distro }}"
        molecule_verify_paths_common:
          - path: /etc/default/google-chrome
            mode: "0644"
            owner: root
            group: root
            content: "{{ molecule_chrome_defaults_content }}"
        molecule_verify_commands: "{{ molecule_verify_commands_common + molecule_verify_commands_distro }}"
        molecule_verify_commands_common:
          - {cmd: "google-chrome-stable --version", stdout_contains: "Google Chrome"}
        molecule_verify_packages:
          present: [google-chrome-stable]
      redhat:
        # The bootstrapped signing key, downloaded in prepare.yml; the role must not touch it.
        molecule_chrome_gpgkey_path: /etc/pki/rpm-gpg/RPM-GPG-KEY-google-chrome
        molecule_chrome_gpgkey_checksum: "{{ molecule_role_defaults.google_chrome_rpm_gpgkey_checksum }}"
        molecule_prepare_seed_files_distro:
          - path: /etc/yum.repos.d/google-chrome.repo
            content: |
              [google-chrome]
              name=google-chrome
              baseurl=https://dl.google.com/linux/chrome/rpm/stable/x86_64
              enabled=1
              gpgcheck=1
              gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-google-chrome
          # A leftover of the managed mode, which the role removes.
          - path: /etc/yum.repos.d/google-chrome-ansible-managed.repo
            content: |
              [google-chrome-managed]
              name=Google Chrome
              baseurl=https://dl-ssl.google.com/linux/chrome/rpm/stable/$$basearch
              enabled=0
              gpgcheck=1
              gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-google-chrome
        molecule_verify_paths_distro:
          - {path: /etc/yum.repos.d/google-chrome.repo, mode: "0644", owner: root, group: root}
          - path: /etc/pki/rpm-gpg/RPM-GPG-KEY-google-chrome
            mode: "0644"
            owner: root
            group: root
            checksum: "{{ molecule_chrome_gpgkey_checksum }}"
          - {path: /etc/yum.repos.d/google-chrome-ansible-managed.repo, state: absent}
        molecule_verify_commands_distro:
          - {cmd: "dnf repoquery --installed --qf '%{from_repo}\\n' google-chrome-stable", stdout: google-chrome}
      debian:
        molecule_chrome_gpgkey_path: /etc/apt/keyrings/google-chrome.asc
        molecule_chrome_gpgkey_checksum: "{{ molecule_role_defaults.google_chrome_deb_gpgkey_checksum }}"
        molecule_prepare_seed_files_distro:
          - path: /etc/apt/sources.list.d/google-chrome.sources
            content: |
              Types: deb
              URIs: https://dl.google.com/linux/chrome/deb/
              Suites: stable
              Components: main
              Architectures: amd64
              Signed-By: /etc/apt/keyrings/google-chrome.asc
          # A leftover of the managed mode, which the role removes; another URI than the vendor source
          # because apt rejects conflicting Signed-By values for one source.
          - path: /etc/apt/sources.list.d/google-chrome-ansible-managed.sources
            content: |
              Types: deb
              URIs: https://dl-ssl.google.com/linux/chrome/deb
              Suites: stable
              Components: main
              Architectures: amd64
              Signed-By: /etc/apt/keyrings/google-chrome.asc
        # The package keeps managing google-chrome.sources: the postinst rewrites the bootstrapped source
        # with its own URI and keyring.
        molecule_verify_paths_distro:
          - path: /etc/apt/sources.list.d/google-chrome.sources
            mode: "0644"
            owner: root
            group: root
            lines: ["Signed-By: /usr/share/keyrings/google-chrome.gpg"]
          - path: /etc/apt/keyrings/google-chrome.asc
            mode: "0644"
            owner: root
            group: root
            checksum: "{{ molecule_chrome_gpgkey_checksum }}"
          - {path: /etc/apt/sources.list.d/google-chrome-ansible-managed.sources, state: absent}
        # The lists stay stale until the next update, which must succeed from the rewritten source alone.
        molecule_verify_commands_distro:
          - cmd: "out=\"$$(apt-get update -o Dir::Etc::SourceList=/etc/apt/sources.list.d/google-chrome.sources
              -o Dir::Etc::SourceParts=- 2>&1)\" && ! grep -E '^(W|E):' <<<\"$$out\""
