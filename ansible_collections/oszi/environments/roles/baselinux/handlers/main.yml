---
- name: Update CA trust
  ansible.builtin.command: "{{ '/usr/bin/update-ca-trust' if ansible_facts.os_family == 'RedHat'
    else '/usr/sbin/update-ca-certificates' }}"
  changed_when: true

# systemd-udevd does not run in containers.
- name: Reload udev rules
  when: "'container' not in ansible_facts.virtualization_tech_guest"
  ansible.builtin.command: "udevadm control --reload"
  changed_when: true
