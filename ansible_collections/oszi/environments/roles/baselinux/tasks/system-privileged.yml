---
- name: Set system timezone
  when: baselinux_timezone is truthy
  community.general.timezone:
    name: "{{ baselinux_timezone }}"

- name: Set custom sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ baselinux_sysctl_conf_path }}"
    sysctl_set: true
    reload: true
    state: "present"
  with_dict: "{{ baselinux_sysctl_values_default | combine(baselinux_sysctl_values) }}"

- name: Set custom hosts in /etc/hosts
  ansible.builtin.lineinfile:
    dest: "/etc/hosts"
    line: "{{ item.value }}  {{ item.key }}"
    regexp: '\s+{{ item.key | regex_escape }}\s*$'
    state: "present"
  with_dict: "{{ baselinux_etc_hosts }}"

- name: Set system hostname  # after setting /etc/hosts
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Install custom udev rules
  ansible.builtin.copy:
    dest: "/etc/udev/rules.d/{{ item.key }}.rules"
    content: "{{ item.value }}"
    owner: "root"
    group: "root"
    mode: "0644"
    validate: "udevadm verify %s"
  with_dict: "{{ baselinux_udev_rules }}"
  notify: "Reload udev rules"

- name: Install custom sudoers rules
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.key }}"
    content: "{{ item.value -}}\n"
    owner: "root"
    group: "root"
    mode: "0440"
    validate: "visudo -csf %s"
  with_dict: "{{ baselinux_sudoers_rules_default | combine(baselinux_sudoers_rules) }}"

# State 'mounted' auto creates the mount point path.
- name: Create system mounts - fstab entries
  ansible.posix.mount:
  args: "{{ item | dict2items | rejectattr('key', 'equalto', 'path_args') | items2dict }}"
  loop: "{{ baselinux_posix_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  notify: "oszi.general.systemd : Reload systemd"

- name: Ensure permissions and ownerships for mounted mount point paths
  ansible.builtin.file:
  args: "{{ item.path_args | combine({'path': item.path, 'state': 'directory'}) }}"
  # state is a required choice option.
  loop: "{{ baselinux_posix_mounts | selectattr('state', 'in', ['mounted', 'remounted', 'ephemeral'])
    | selectattr('path_args', 'defined') }}"
  loop_control:
    label: "{{ item.path }}"

- name: Include swap file configuration tasks
  when: baselinux_swapfile_path is truthy and baselinux_swapfile_size is truthy
  ansible.builtin.include_tasks:
    file: swapfile.yml

- name: Ignore DNS settings by DHCP client
  when: baselinux_dhclient_resolvconf_disabled
  ansible.builtin.copy:
    dest: "/etc/dhcp/dhclient-enter-hooks.d/make_resolv_conf"
    content: |
      #!/bin/sh
      make_resolv_conf() {
          :
      }
    owner: "root"
    group: "root"
    mode: "0755"
