---
- name: Baselinux role tasks
  tags: [baselinux]
  block:
    - name: Privileged system setup tasks
      when: "'container' not in ansible_facts.virtualization_tech_guest"
      ansible.builtin.import_tasks:
        file: system-privileged.yml

    - name: Common system setup tasks
      ansible.builtin.import_tasks:
        file: system.yml
