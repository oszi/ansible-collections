---
- name: Create system symlinks
  ansible.builtin.file:
    src: "{{ item.value }}"
    dest: "{{ item.key }}"
    force: true
    state: "link"
  with_dict: "{{ baselinux_symlinks }}"

- name: Ensure baselinux_absent_paths are deleted
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items: "{{ baselinux_absent_paths }}"

- name: Trust configured certificate authorities
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ baselinux_ca_trust_anchors_path }}/{{ item | basename | regex_replace('\\.(pem|crt)$', '')
      }}.{{ baselinux_ca_trust_anchors_extension }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_items: "{{ baselinux_ca_trust_anchors }}"
  notify: "Update CA trust"

- name: Remove blacklisted certificate authorities
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items: "{{ baselinux_ca_trust_anchors_blacklisted_paths }}"
  notify: "Update CA trust"

- name: "[Un]install QEMU guest agent"
  ansible.builtin.package:
    name: "qemu-guest-agent"
    state: "{{ 'present' if ansible_facts.virtualization_type in ['kvm', 'xen']
      and ansible_facts.virtualization_role == 'guest' else 'absent' }}"

- name: "[Un]install VMWare guest agent"
  ansible.builtin.package:
    name: "open-vm-tools"
    state: "{{ 'present' if ansible_facts.virtualization_type == 'VMware'
      and ansible_facts.virtualization_role == 'guest' else 'absent' }}"

- name: Emulate iptables with nft alternatives
  when: baselinux_iptables_nft_alternatives
  block:
    - name: Ensure iptables-nft and nftables are installed
      ansible.builtin.package:
        name:
          - "{{ 'iptables-nft' if ansible_facts.os_family == 'RedHat' else 'iptables' }}"
          - "nftables"
        state: "present"

    # Alternatives store the paths as registered by the packages: /usr/bin where /usr/sbin links to it.
    - name: Find the system binaries directory
      ansible.builtin.stat:
        path: "/usr/sbin"
      register: _baselinux_sbin_result

    # Subcommands (restore, save, etc) are followers of the package-registered groups; a link or path
    # differing from the registered one re-registers the group without them. RedHat registers ip6tables
    # as a follower of iptables, Debian as a group of its own.
    # On RedHat, the package's priority and followers are passed so that an entry registered without them
    # is re-registered as the package does; the module compares both against the current entry.
    - name: Configure iptables alternatives
      vars:
        _baselinux_sbin_path: "{{ _baselinux_sbin_result.stat.lnk_source | default('/usr/sbin') }}"
        _baselinux_iptables_followers:
          - name: "ip6tables"
            link: "{{ _baselinux_sbin_path }}/ip6tables"
            path: "{{ _baselinux_sbin_path }}/ip6tables-nft"
          - name: "iptables-restore"
            link: "{{ _baselinux_sbin_path }}/iptables-restore"
            path: "{{ _baselinux_sbin_path }}/iptables-nft-restore"
          - name: "iptables-save"
            link: "{{ _baselinux_sbin_path }}/iptables-save"
            path: "{{ _baselinux_sbin_path }}/iptables-nft-save"
          - name: "ip6tables-restore"
            link: "{{ _baselinux_sbin_path }}/ip6tables-restore"
            path: "{{ _baselinux_sbin_path }}/ip6tables-nft-restore"
          - name: "ip6tables-save"
            link: "{{ _baselinux_sbin_path }}/ip6tables-save"
            path: "{{ _baselinux_sbin_path }}/ip6tables-nft-save"
      community.general.alternatives:
        name: "{{ item }}"
        link: "{{ _baselinux_sbin_path }}/{{ item }}"
        path: "{{ _baselinux_sbin_path }}/{{ item }}-nft"
        priority: "{{ 10 if ansible_facts.os_family == 'RedHat' else omit }}"
        subcommands: "{{ _baselinux_iptables_followers if ansible_facts.os_family == 'RedHat' else omit }}"
      loop: "{{ ['iptables'] if ansible_facts.os_family == 'RedHat' else ['iptables', 'ip6tables'] }}"
