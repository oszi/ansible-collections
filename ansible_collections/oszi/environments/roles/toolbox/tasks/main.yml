---
- name: Toolbox role tasks
  tags: [toolbox]
  block:
    - name: Toolbox package setup tasks
      ansible.builtin.import_tasks:
        file: packages.yml

    - name: Install toolbox scripts
      ansible.builtin.copy:
        src: "bin/"
        dest: "{{ toolbox_local_bin_path }}/"
        owner: "root"
        group: "root"
        directory_mode: "0755"
        mode: "0755"
