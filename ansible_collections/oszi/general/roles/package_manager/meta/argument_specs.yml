---
argument_specs:
  main:
    short_description: System package manager role
    description:
      - Configures apt.conf.d and dnf.conf [main] options
      - Writes dnf5 repository overrides to /etc/dnf/repos.override.d
      - Replaces regexp patterns in distro-shipped repo files
      - Installs and removes extra distribution packages
    author:
      - "David O. (oszi.dev)"
    options:
      package_manager_disabled:
        description:
          - Whether to skip all package manager role configuration tasks
          - Useful for read-only systems or immutable environments
        type: bool
        required: false
        default: false

      package_manager_apt_conf:
        description:
          - Dict of apt options to set in /etc/apt/apt.conf.d/99-ansible-managed.conf
          - Values are auto-quoted, use lower-case string for booleans; trailing semicolon is added
        type: dict
        required: false

      package_manager_dnf_conf:
        description:
          - Dict of dnf options to set in the [main] section of /etc/dnf/dnf.conf
        type: dict
        required: false

      package_manager_dnf_repo_overrides:
        description:
          - List of dnf5 repository overrides written to /etc/dnf/repos.override.d/90-ansible-managed.repo;
            the native way to adjust distro-shipped repositories, which Fedora 45+ ships in /usr/share/dnf5/repos.d;
            the file is only written when the list is not empty
          - Overrides modify existing repositories only, they cannot create new ones; an empty value unsets an option;
            files apply in alphabetical order with the last one winning, so dnf config-manager setopt
            (99-config_manager.repo) still overrides the ansible managed file
        type: list
        elements: dict
        required: false
        options:
          repo:
            description:
              - Repository ID, may contain globs; for example, `fedora*` or `rpmfusion-*`
              - Fedora ships `fedora`, `updates` and `fedora-cisco-openh264`, so `fedora*` does not cover the updates repository
            type: str
            required: true
          options:
            description:
              - Dict of repository options to override; lists are joined with commas
              - For example, `baseurl` with an empty `metalink` for a mirror, or `enabled`
            type: dict
            required: true

      package_manager_repo_replacements:
        description:
          - List of regexp/replace pairs to be applied to distro-shipped repo files
          - Targets are defined in O(package_manager_repo_replacements_targets)
          - Fedora 45+ ships its repo files in /usr/share/dnf5/repos.d, which must not be edited;
            use O(package_manager_dnf_repo_overrides)
        type: list
        elements: dict
        required: false
        options:
          after:
            description:
              - If specified, only content after this match will be replaced
              - Python regular expressions, uses `DOTALL`, does not use `MULTILINE`
            type: str
            required: false
          before:
            description:
              - If specified, only content before this match will be replaced
              - Python regular expressions, uses `DOTALL`, does not use `MULTILINE`
            type: str
            required: false
          regexp:
            description:
              - Python regular expression; see https://docs.python.org/3/library/re.html
              - Uses `MULTILINE`, does not use `DOTALL`
              - For example, `'https?://(\w+\.)?(\w+)\.ubuntu\.com'`
            type: str
            required: true
          replace:
            description:
              - String to replace regexp matches
              - Backreferences can be used ambiguously like `\1`, or explicitly like `\g<1>`
              - For example, `'https://\2.ubuntu.com'`
            type: str
            required: true

      package_manager_repo_replacements_targets:
        description:
          - List of glob patterns targeted by O(package_manager_repo_replacements)
          - Default matches Debian, Ubuntu, Fedora, and most EL repo files, also RPM Fusion
          - Only files in /etc are targeted; on Fedora 45+ the distro-shipped files are in /usr/share/dnf5/repos.d
        type: list
        elements: str
        required: false

      package_manager_extra_packages:
        description:
          - Nested list of additional package names to install on all Linux hosts
        type: list
        elements: raw
        required: false

      package_manager_blacklisted_packages:
        description:
          - Nested list of package names to remove from all Linux hosts
          - Useful for removing unwanted or conflicting packages
        type: list
        elements: raw
        required: false

  update:
    short_description: Update entrypoint for system package updates
    description:
      - Updates distribution packages
      - Autoremoves orphaned packages by default
    options:
      package_manager_update_autoremove:
        description:
          - Whether to autoremove orphaned packages
        type: bool
        required: false
        default: true
