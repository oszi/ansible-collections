---
# Skip shell setup tasks (e.g. read-only systems)?
shell_disabled: false

# Basic system-wide shell customizations:
shell_histsize: 10000
shell_histfilesize: 10000
shell_tmux_history_limit: 100000
shell_tmux_default_shell: ""  # Default is $SHELL
shell_tmux_conf_extra: ""  # Appended to .tmux.conf

# Dict of environment variables:
# * If EDITOR or VISUAL is vi, ZSH switches to vi key-bindings.
shell_environment:
  ENV: "{{ shell_shrc_path }}"
  EDITOR: nano

# List of extra paths to add to $PATH; last path added is searched first:
# Skip flatpak for root, but not in skel where shell_user_info is a placeholder.
shell_search_paths: "{{ (['/var/lib/flatpak/exports/bin', '~/.local/share/flatpak/exports/bin']
  if not flatpak_disabled | default(false) and shell_user_info.name != 'root' else [])
  + ['~/.local/bin', '~/bin'] }}"

# List of users to enforce skel templates for:
shell_skeleton_enforced_users: "{{ (['root', ansible_user | default('root')]
  + (users_list | map(attribute='name') | list if users_list is defined else [])) | unique }}"

# Ensure shell_packages are installed? Disable for immutable systems.
shell_manage_packages: true

# Nested list of shell packages to install (RedHat/Debian):
# When shell_manage_packages is true.
shell_packages:
  # Important shell packages
  - bash
  - bash-completion
  - zsh
  - tmux
  # Become with unprivileged users
  - acl
  # Git and GnuPG - configured by oszi.general.dotfiles
  - "{{ ['git-delta'] if ansible_facts.os_family != 'RedHat'
    or ansible_facts.distribution == 'Fedora' else [] }}"
  - git
  - gnupg
  # Essential tools
  - bat
  - bc
  - curl
  - findutils
  - fzf
  - gawk
  - grep
  - jq
  - less
  - nano  # $EDITOR
  - pinentry-tty
  - ripgrep
  - rsync
  - screen
  - tar
  - tree
  - util-linux

# Absolute paths for shrc.d and the shrc entrypoint (override if /etc is not writeable).
shell_shrc_d_path: "/etc/shrc.d"
shell_shrc_path: "/etc/shrc"

# Directory to install system skel templates to, used by useradd, disabled if empty.
shell_skel_path: "/etc/skel"

# Path for local executables.
shell_local_bin_path: "{{ local_bin_path | default('/usr/local/bin', true) }}"

# List of ZSH-compatible bash-completion files to pre-load when native completion does not exist (_command).
# Most bash-completion files are not ZSH-compatible, use selectively.
shell_bash_completions_for_zsh:
  # completion.zsh.inc is still bash in part and does not work with auto-loading.
  # Use /etc/bash_completion.d/gcloud for older versions.
  - command: gcloud
    path: "/usr/{{ (ansible_facts.os_family == 'Debian') | ternary('lib', 'lib64') }}/google-cloud-sdk/completion.zsh.inc"
  # No default ZSH completion for wireguard.
  - command: wg
    path: "/usr/share/bash-completion/completions/wg"
