---
- name: Assert that shrc.d, shrc, skel paths are valid
  ansible.builtin.assert:
    that:
      - "shell_shrc_d_path is truthy and shell_shrc_d_path.startswith('/')"
      - "shell_shrc_path is truthy and shell_shrc_path.startswith('/')"
      - "shell_skel_path is not truthy or shell_skel_path.startswith('/')"

- name: Flatten package list variables
  ansible.builtin.set_fact:
    shell_packages: "{{ shell_packages | flatten }}"

- name: Ensure shell packages are installed
  when: shell_manage_packages
  ansible.builtin.package:
    name: "{{ shell_packages }}"
    state: "present"

- name: Include bat/batcat alternatives tasks
  when: "shell_manage_packages and 'bat' in shell_packages"
  ansible.builtin.include_tasks:
    file: bat-batcat.yml

- name: Ensure shrc.d directory exists
  ansible.builtin.file:
    path: "{{ shell_shrc_d_path }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: Copy shrc.d directory
  ansible.builtin.copy:
    src: "etc/shrc.d/"
    dest: "{{ shell_shrc_d_path }}/"
    owner: "root"
    group: "root"
    directory_mode: "0755"
    mode: "0644"

- name: Install shrc.d templates
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ [shell_shrc_d_path, item | basename | regex_replace('\\.j2$', '')] | path_join }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_fileglob:
    - "templates/etc/shrc.d/*.j2"

- name: Install shrc entrypoint
  ansible.builtin.template:
    src: "etc/shrc.j2"
    dest: "{{ shell_shrc_path }}"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Ensure system skel directory exists
  when: shell_skel_path is truthy
  ansible.builtin.file:
    path: "{{ shell_skel_path }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: Install system skel templates
  when: shell_skel_path is truthy
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ [shell_skel_path, item | basename | regex_replace('\\.j2$', '')] | path_join }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_fileglob:
    - "templates/etc/skel/.*.j2"

- name: Remove obsolete shell config files
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  with_items: "{{ shell_obsolete_config_files }}"
