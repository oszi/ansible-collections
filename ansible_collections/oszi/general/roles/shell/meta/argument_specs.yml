---
argument_specs:
  main:
    short_description: Shell environment configuration for Linux
    description:
      - Configures system-wide shell environment for Bash, ZSH and POSIX shells
      - Manages aliases, completions, prompts, history, environment variables, PATH and more
      - Installs essential shell tools and utilities
      - Enforces skeleton files for consistent user shell environments
    author:
      - "David O. (oszi.dev)"
    options:
      shell_disabled: &shell_disabled
        description:
          - Whether to skip all shell configuration tasks
          - Useful for read-only systems or immutable environments
        type: bool
        required: false
        default: false

      shell_histsize:
        description:
          - Number of commands to keep in shell history per session in memory
        type: int
        required: false

      shell_histfilesize:
        description:
          - Number of commands to keep in shell history on disk
        type: int
        required: false

      shell_tmux_history_limit:
        description:
          - Number of scrollback lines to keep in tmux
        type: int
        required: false

      shell_tmux_default_shell:
        description:
          - Override default shell from `$SHELL` for all tmux users
          - Useful when a user's shell is /bin/tmux or /bin/sh
        type: str
        required: false

      shell_tmux_conf_extra:
        description:
          - Additional content appended to .tmux.conf; use for custom overrides
          - |
            For example:
            ```
            # Let arbitrary, potentially dangerous escapes through (e.g., OSC52 clipboard, images)
            set -g allow-passthrough on
            set -g set-clipboard on
            ```
        type: str
        required: false

      shell_environment:
        description:
          - Dictionary of environment variables to set system-wide
          - If EDITOR or VISUAL is vi, ZSH switches to vi key-bindings
        type: dict
        required: false

      shell_search_paths:
        description:
          - List of additional paths to add to $PATH in .profile; last path added is searched first
          - Paths are auto quoted via `oszi.utils.home_var_to_quoted_tilde_path`; `$HOME` is replaced by `~`
          - Default is `~/.local/bin`, `~/bin`, after flatpak exports/bin paths if not disabled
        type: list
        elements: str
        required: false

      shell_skeleton_enforced_users:
        description:
          - List of usernames to enforce role-managed `skel` files for; ensures consistent shell configuration
            for all specified users; excludes system users with `nologin` shell
          - Runs tasks as each user with become to isolate users from each other;
            Ansible skips become for the connection user itself (see the Core Conventions)
          - Default is `users_list` + `ansible_user` + `root`
        type: list
        elements: str
        required: false

      shell_manage_packages:
        description:
          - Whether to install packages in O(shell_packages), disable for immutable systems
        type: bool
        required: false
        default: true

      shell_packages:
        description:
          - Nested list of shell and essential utility packages to install when O(shell_manage_packages)
          - Includes important shell packages - bash, bash-completion, zsh, and tmux
          - Includes the acl package required for unprivileged become on Linux
          - Includes git and gnupg - configured by `oszi.general.dotfiles`, and essential CLI tools
        type: list
        elements: raw
        required: false

      shell_shrc_d_path: &shell_shrc_d_path
        description:
          - Directory path where shrc.d files are installed, sourced by the shrc entrypoint
          - All files in shrc.d must be owned by root and be world-readable, also in downstream integrations
          - Override if /etc is not writeable (e.g., /usr/local/etc/shrc.d)
        type: path
        required: false
        default: /etc/shrc.d

      shell_shrc_path:
        description:
          - File path where the shrc entrypoint is installed, sourced by skel templates and set as `ENV`
          - The shrc entrypoint is POSIX-compatible, owned by root and world-readable
          - Override if /etc is not writeable (e.g., /usr/local/etc/shrc)
        type: path
        required: false
        default: /etc/shrc

      shell_skel_path:
        description:
          - Directory path where system skel templates are installed - disabled if empty
          - All files in skel must be owned by root and be world-readable, also in downstream integrations
          - Default is /etc/skel used by useradd, see `SKEL` in /etc/default/useradd
        type: path
        required: false
        default: /etc/skel

      shell_local_bin_path:
        description:
          - Directory path where shell scripts and local binaries are installed
          - Defaults to `local_bin_path` if set (should be in system PATH), or /usr/local/bin
        type: path
        required: false

      shell_bash_completions_for_zsh:
        description:
          - List of ZSH-compatible bash-completion files to pre-load when native completion does not exist
          - Most bash-completion files are not ZSH-compatible, use selectively
        type: list
        elements: dict
        required: false
        options:
          command:
            description: Command to load completions for if `_command` does not exist
            type: str
            required: true
          path:
            description: Path to a ZSH-compatible bash-completion file
            type: path
            required: true

  facts:
    short_description: Facts only entrypoint
    description:
      - Get shell role facts without changing anything
      - Fact `shell_integrations_enabled` is derived from O(shell_disabled) to guard against in downstream roles
      - Fact `shell_integrations_shrc_d_path` contains `shell_shrc_d_path` to add shrc.d integrations in downstream roles
    options:
      shell_disabled:
        <<: *shell_disabled
      shell_shrc_d_path:
        <<: *shell_shrc_d_path
