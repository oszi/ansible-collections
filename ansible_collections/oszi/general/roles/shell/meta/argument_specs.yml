---
argument_specs:
  main:
    short_description: Shell environment configuration for Linux
    description:
      - Configures system-wide shell environment for Bash, ZSH and POSIX shells
      - Manages aliases, completions, prompts, history, environment variables, PATH and more
      - Installs essential shell tools and utilities
      - Enforces skeleton files for consistent user shell environments
      - Supports rootless mode for a single user, without packages
    author:
      - "David O. (oszi.dev)"
    options:
      shell_disabled: &shell_disabled
        description:
          - Whether to skip all shell configuration tasks
          - Useful for read-only systems or immutable environments
        type: bool
        required: false
        default: false

      shell_histsize:
        description:
          - Number of commands to keep in shell history per session in memory
        type: int
        required: false

      shell_histfilesize:
        description:
          - Number of commands to keep in shell history on disk
        type: int
        required: false

      shell_tmux_history_limit:
        description:
          - Number of scrollback lines to keep in tmux
        type: int
        required: false

      shell_tmux_default_shell:
        description:
          - Override default shell from `$SHELL` for all tmux users
          - Useful when a user's shell is /bin/tmux or /bin/sh
        type: str
        required: false

      shell_tmux_conf_extra:
        description:
          - Additional content appended to .tmux.conf; use for custom overrides
          - |
            For example:
            ```
            # Let arbitrary, potentially dangerous escapes through (e.g., OSC52 clipboard, images)
            set -g allow-passthrough on
            set -g set-clipboard on
            ```
        type: str
        required: false

      shell_environment:
        description:
          - Dictionary of environment variables to set system-wide
          - If EDITOR or VISUAL is vi, ZSH switches to vi key-bindings
        type: dict
        required: false

      shell_search_paths:
        description:
          - List of additional paths to add to $PATH in .profile; last path added is searched first
          - Paths should be escaped for shells (e.g., `'"$HOME"/.local/bin'`)
          - Default is `'"$HOME"/.local/bin'`, `'"$HOME"/bin'`, after flatpak exports/bin paths if not disabled
        type: list
        elements: str
        required: false

      shell_skeleton_enforced_users:
        description:
          - List of usernames to enforce role-managed `skel` files for
          - Ensures consistent shell configuration for all specified users
          - Default is users_list + ansible_user + root, or user_id in rootless mode
        type: list
        elements: str
        required: false

      shell_install_packages:
        description:
          - Whether to install packages in O(shell_packages)
          - Enabled when running as root, disable on immutable systems
        type: bool
        required: false

      shell_packages:
        description:
          - Nested list of shell and essential utility packages to install when O(shell_install_packages)
          - Includes important shell packages - bash, bash-completion, zsh, and tmux
          - Includes git and gnupg - configured by `oszi.general.dotfiles`, and essential CLI tools
        type: list
        elements: raw
        required: false

      shell_etc_path: &shell_etc_path
        description:
          - Directory path where shrc entrypoint, shrc.d, and skel are installed
          - Used in role vars `shell_shrc_d_path`, `shell_shrc_path`, and `shell_skel_path`
          - Related fact `shell_shrc_d_export_path` contains `shell_shrc_d_path` for downstream roles
          - Override if /etc is not writeable (e.g., /usr/local/etc)
          - Default is /etc, or ~/.config (using ansible_facts.user_dir) in rootless mode
        type: path
        required: false
        default: /etc

      shell_local_bin_path:
        description:
          - Directory path where shell scripts and local binaries are installed
          - Defaults to `local_bin_path` if set (should be in system PATH),
            or ~/.local/bin (using ansible_facts.user_dir) in rootless mode
        type: path
        required: false

      shell_bash_completions_for_zsh:
        description:
          - List of ZSH-compatible bash-completion files to pre-load when native completion does not exist
          - Most bash-completion files are not ZSH-compatible, use selectively
        type: list
        elements: dict
        required: false
        options:
          command:
            description: Command to load completions for if `_command` does not exist
            type: str
            required: true
          path:
            description: Path to a ZSH-compatible bash-completion file
            type: path
            required: true

  facts:
    short_description: Facts only entrypoint
    description:
      - Get shell role facts without changing anything; do not mix privilege levels in playbooks, variables are privilege-aware
      - Fact `shell_shrc_d_export_path` contains `shell_shrc_d_path` for downstream roles to add shrc integrations;
        is set to empty string if O(shell_disabled) (guard with `is truthy`)
    options:
      shell_disabled:
        <<: *shell_disabled
      shell_etc_path:
        <<: *shell_etc_path
