---
- name: Fail2ban setup tasks
  tags: [fail2ban]
  block:
    - name: Include Fail2ban setup tasks
      ansible.builtin.include_tasks:
        file: "{{ (not fail2ban_disabled) | ternary('install', 'uninstall') }}.yml"

    - name: Fail2ban role completed
      ansible.builtin.assert:
        that: true
        quiet: true
