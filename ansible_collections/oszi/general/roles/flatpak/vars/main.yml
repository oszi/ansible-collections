---
# Flatpak method to use: system or user (rootless)
flatpak_method: "{{ 'system' if ansible_facts.user_uid | int == 0 else 'user' }}"

# Path to search and save flatpak run wrappers (rootless aware)
flatpak_exports_bin_path: "{{ '/var/lib' if ansible_facts.user_uid | int == 0
  else ansible_facts.user_dir + '/.local/share' }}/flatpak/exports/bin"
