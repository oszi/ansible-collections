---
argument_specs:
  main:
    short_description: Flatpak package manager and application management
    description:
      - Manages Flatpak remotes (repositories) and applications
      - Configures global and per-application sandboxing overrides
      - Handles application installation, overrides, and removal
      - Supports rootless mode with Flatpak user method, see O(flatpak_method)
    author:
      - "David O. (oszi.dev)"
    options:
      flatpak_disabled: &flatpak_disabled
        description:
          - Whether to install or uninstall the Flatpak package manager when O(flatpak_method) is system
          - Skip all other flatpak tasks if true, including the update entrypoint
        type: bool
        required: false
        default: false

      flatpak_method: &flatpak_method
        description:
          - Flatpak installation method, system-wide or current user
          - Default is derived from ansible_facts.user_uid, system when running as root, user otherwise
        type: str
        required: false
        choices: [system, user]

      flatpak_remotes:
        description:
          - Dictionary of Flatpak remotes to install
          - Keys are remote names, values are flatpakrepo URLs or repository URLs
          - "Example: {flathub: 'https://flathub.org/repo/flathub.flatpakrepo'}"
        type: dict
        required: false

      flatpak_apps:
        description:
          - Dictionary mapping application IDs to remote names
          - Keys are Flatpak application IDs, values are the remote to install from
          - "Example: {org.chromium.Chromium: flathub}"
        type: dict
        required: false

      flatpak_blacklisted_apps:
        description:
          - List of Flatpak application IDs to uninstall
          - Applications are removed if present on the system
        type: list
        elements: str
        required: false

      flatpak_global_overrides:
        description:
          - List of global Flatpak permission overrides applied to all applications
          - Uses flatpak override syntax (e.g., --nofilesystem=host, --nofilesystem=home)
          - Applied system-wide to restrict default Flatpak permissions
        type: list
        elements: str
        required: false

      flatpak_app_overrides:
        description:
          - Dictionary of per-application permission overrides
          - Keys are application IDs, values are lists of override arguments
          - "Example: {com.example.App: ['--nofilesystem=home', '--filesystem=/mnt/data:ro']}"
        type: dict
        required: false

      flatpak_exports_bin_aliases:
        description:
          - Dictionary of aliases to bin exports to symlink in `/var/lib/flatpak/exports/bin`,
            or in `~/.local/share/flatpak/exports/bin` when O(flatpak_method) is user
          - Keys are command names, values are relative symlinks already present in the above paths, or absolute paths
          - "Example: {chromium: org.chromium.Chromium}"
        type: dict
        required: false

      flatpak_exports_bin_aliases_absent:
        description:
          - List of obsolete filenames to remove from `/var/lib/flatpak/exports/bin`,
            or from `~/.local/share/flatpak/exports/bin` when O(flatpak_method) is user
        type: list
        elements: str
        required: false

  update:
    short_description: Update entrypoint for flatpak packages
    description:
      - Updates system or user flatpak packages, depending on O(flatpak_method)
    options:
      flatpak_disabled:
        <<: *flatpak_disabled
      flatpak_method:
        <<: *flatpak_method
