---
- name: Deploy podman networks
  containers.podman.podman_network:
  args: "{{ item }}"
  loop: "{{ podman_networks_list | oszi.utils.unique_nested_list('name') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy podman images
  containers.podman.podman_image:
  args: "{{ item }}"
  loop: "{{ podman_images_list | oszi.utils.unique_nested_list('name') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy podman containers
  containers.podman.podman_container:
  args: "{{ item }}"
  loop: "{{ podman_containers_list | oszi.utils.unique_nested_list('name') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy podman pods
  containers.podman.podman_pod:
  args: "{{ item }}"
  loop: "{{ podman_pods_list | oszi.utils.unique_nested_list('name') }}"
  loop_control:
    label: "{{ item.name }}"
