---
- name: Ensure podman, buildah, skopeo are installed
  ansible.builtin.package:
    name:
      - "podman"
      - "buildah"
      - "skopeo"
    state: "present"

- name: Ensure toolbox is installed - containertoolbx.org
  ansible.builtin.package:
    name: "{{ podman_toolbox_package }}"
    state: "{{ podman_toolbox_enabled | ternary('present', 'absent') }}"

- name: Ensure podman-compose is present or absent
  ansible.builtin.package:
    name: "podman-compose"
    state: "{{ podman_compose_enabled | ternary('present', 'absent') }}"

- name: Ensure podman-docker is present or absent
  ansible.builtin.package:
    name: "podman-docker"
    state: "{{ podman_docker_enabled | ternary('present', 'absent') }}"

- name: Enable podman daemons and docker-compose
  when: podman_docker_enabled
  block:
    - name: Ensure docker-compose is present or absent
      ansible.builtin.package:
        name: "docker-compose"
        state: "{{ podman_docker_compose_enabled | ternary('present', 'absent') }}"

    - name: Enable system podman.socket
      ansible.builtin.systemd:
        name: "podman.socket"
        scope: "system"
        enabled: true

    - name: Enable global podman.socket
      ansible.builtin.systemd:
        name: "podman.socket"
        scope: "global"
        enabled: true
