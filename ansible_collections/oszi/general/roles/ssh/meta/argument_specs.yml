---
argument_specs:
  main:
    short_description: OpenSSH server configuration and key management
    description:
      - Manages OpenSSH server installation and configuration
      - Configures authorized keys for SSH access
      - Supports SSH crypto hardening and host key selection
      - Allows user-based access control and custom sshd_config settings
    author:
      - "David O. (oszi.dev)"
    options:
      ssh_server_disabled:
        description:
          - Whether to uninstall OpenSSH server when O(ssh_manage_packages) is true, or disable the sshd service;
            the sshd socket service is always disabled in favor of the sshd service
          - Default is true for containers; false otherwise (install and configure sshd)
        type: bool
        required: false

      ssh_manage_packages:
        description:
          - Whether to install OpenSSH server and O(ssh_extra_packages), or uninstall only OpenSSH server
            when O(ssh_server_disabled) is true
        type: bool
        required: false
        default: true

      ssh_authorized_keys_enabled:
        description:
          - Whether to configure SSH authorized keys set in O(ssh_authorized_keys)
          - Default is true when O(ssh_server_disabled) is false; can be enabled regardless of the server
        type: bool
        required: false

      ssh_authorized_keys:
        description:
          - Dictionary of authorized SSH keys by username to configure when O(ssh_authorized_keys_enabled) is true
          - Keys are usernames, values are SSH public keys (multiple keys can be separated by newlines)
          - |-
            Advanced example with multiple keys and restrictions:
            ```yaml
            ssh_authorized_keys:
              mobile: |-
                from="0.0.0.0/0",restrict,pty ssh-ed25519 AAAA... mobile-biometric
                from="0.0.0.0/0",restrict,command="{{ ssh_sftp_subsystem }}" ssh-ed25519 AAAA... mobile-sftp-only
            ```
        type: dict
        required: false

      ssh_authorized_keys_exclusive:
        description:
          - Whether to remove authorized keys that were not configured here
          - When true, only keys specified in ssh_authorized_keys are allowed
        type: bool
        required: false
        default: true

      ssh_authorized_keys_immutable:
        description:
          - Whether to make authorized_keys files immutable to protect restrictions
          - Note - Without making ~/.ssh append-only (+a) this can still be worked around
          - Making ~/.ssh append-only breaks some legitimate use cases like cleaning up control sockets
        type: bool
        required: false
        default: false

      ssh_server_config_overridable:
        description:
          - Whether to override the distribution-provided sshd_config when O(ssh_server_disabled) is false
          - When true, the role manages /etc/ssh/sshd_config, set to false to only manage the rest of the configuration
        type: bool
        required: false
        default: true

      ssh_server_log_level:
        description:
          - Log level of the ssh server
        type: str
        required: false
        default: VERBOSE
        choices:
          - QUIET
          - FATAL
          - ERROR
          - INFO
          - VERBOSE
          - DEBUG
          - DEBUG1
          - DEBUG2
          - DEBUG3

      ssh_server_config_extra:
        description:
          - Extra configuration lines to append to sshd_config
          - Use for additional SSH server settings not covered by role defaults
        type: str
        required: false

      ssh_auth_methods:
        description:
          - Space-separated list of one or more comma-separated authentication methods that must be successfully completed
            for a user to be granted access; authentication requires completion of exactly one complete AND-logic method listed
          - Known authentication methods - `publickey` `password` `hostbased` `keyboard-interactive` `none`
          - For example, `publickey,password publickey,keyboard-interactive`, `publickey,publickey` to require two different public keys
        type: str
        required: false
        default: publickey

      ssh_allow_users:
        description:
          - List of usernames allowed to connect via SSH
          - When set, generates AllowUsers directive in sshd_config
          - If both AllowUsers and AllowGroups are specified, clients must match both
        type: list
        elements: str
        required: false

      ssh_allow_groups:
        description:
          - List of groups allowed to connect via SSH
          - When set, generates AllowGroups directive in sshd_config
          - If both AllowUsers and AllowGroups are specified, clients must match both
        type: list
        elements: str
        required: false

      ssh_harden_crypto:
        description:
          - Whether to harden SSH server cryptographic settings in sshd_config
          - Restricts to strong ciphers, MACs, and key exchange algorithms; ECDSA is disabled; required RSA size is 3072
          - See related O(ssh_harden_crypto_post_quantum_enabled) and O(ssh_harden_crypto_rsa_enabled)
        type: bool
        required: false
        default: true

      ssh_harden_crypto_post_quantum_enabled:
        description:
          - Whether to enable post-quantum algorithms in hardened SSH server cryptographic settings
        type: bool
        required: false
        default: true

      ssh_harden_crypto_rsa_enabled:
        description:
          - Whether to enable RSA host key and Diffie-Hellman key exchange algorithms in hardened server cryptographic settings
          - Default is true if there is an `rsa{BITS}` key in O(ssh_host_keys)
        type: bool
        required: false

      ssh_host_keys:
        description:
          - List of SSH host key paths; should contain at least one Ed25519 host key for modern cryptography
          - Missing keys are auto generated based on word-boundary or underscore-delimited `ed25519`, `rsa{BITS}`,
            or `ecdsa{BITS}` components in the filenames; -sk keys are not supported as host keys;
            turn off O(ssh_harden_crypto) to allow ECDSA algorithms
          - Default is Ed25519 only; only listed host keys will be active on the server
        type: list
        elements: path
        required: false
        default:
          - /etc/ssh/ssh_host_ed25519_key

      ssh_extra_packages:
        description:
          - Nested list of additional SSH packages to install when O(ssh_manage_packages) is true
          - Default is openssh-client(s); these extra packages are never uninstalled
        type: list
        elements: raw
        required: false
