---
# Disable sshd and uninstall openssh-server if ssh_manage_packages?
ssh_server_disabled: "{{ ansible_facts.virtualization_type == 'container' }}"
# Install openssh-server and extra packages, or uninstall the server?
ssh_manage_packages: true

# Whether to configure ssh_authorized_keys?
ssh_authorized_keys_enabled: "{{ not ssh_server_disabled and ssh_authorized_keys is truthy }}"
# Dict of authorized keys by user:
# Multiple pubkeys can be separated by new lines, for example:
# from="0.0.0.0/0",restrict,pty ssh-ed25519 AAAA... mobile-biometric
# from="0.0.0.0/0",restrict,command="{{ ssh_sftp_subsystem }}" ssh-ed25519 AAAA... mobile-sftp-only
ssh_authorized_keys: {}
# Remove keys that were not configured here?
ssh_authorized_keys_exclusive: true
# Change authorized_keys files location to ssh_authorized_keys_d_path (root-owned)?
ssh_authorized_keys_immutable: "{{ ssh_authorized_keys_exclusive and ssh_server_config_overridable }}"

# Override the distro sshd_config?
ssh_server_config_overridable: true
# LogLevel directive in sshd_config
ssh_server_log_level: "VERBOSE"
# Extra lines for sshd_config
ssh_server_config_extra: ""

# Space-separated list of one or more comma-separated authentication methods...
# publickey password hostbased keyboard-interactive none
ssh_auth_methods: "publickey"
# List of SSH allowed users
ssh_allow_users: []
# List of SSH allowed groups
ssh_allow_groups: []

# Harden sshd crypto settings?
ssh_harden_crypto: true
# Enable post-quantum Kex algorithms?
ssh_harden_crypto_post_quantum_enabled: true
# Enable legacy DH Kex and RSA host key algorithms?
ssh_harden_crypto_rsa_enabled: "{{ ssh_host_keys | map('basename') | join(' ')
  | regex_search(ssh_host_key_regex_rsa) is not none }}"

# List of host keys (see ssh_host_key_regex_all):
ssh_host_keys:
  - /etc/ssh/ssh_host_ed25519_key
  # - /etc/ssh/ssh_host_rsa4096_key

# List of extra packages besides openssh-server:
ssh_extra_packages:
  - "{{ ['openssh-client'] if ansible_facts.os_family == 'Debian' else [] }}"
  - "{{ ['openssh-clients'] if ansible_facts.os_family == 'RedHat' else [] }}"
