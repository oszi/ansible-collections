---
# Use ansible_port to automatically control the SSH port with the help of oszi.utils.bootstrap.
# This role also works without bootstrap as long as we have a working connection.
# The loosely coupled firewalld, selinux and ssh roles must all use this ssh_port variable pattern.
ssh_port: "{{ bootstrap_ssh_port | default(ansible_port | default(22)) | int }}"

# On RedHat, internal-sftp is blocked by SELinux, use the distribution default sftp-server.
# Use this variable in ssh_authorized_keys for sftp-only command restriction.
ssh_sftp_subsystem: "{{ '/usr/libexec/openssh/sftp-server' if ansible_facts.os_family == 'RedHat' else 'internal-sftp' }}"

# Ciphers: AEAD only.
ssh_harden_crypto_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com

# MACs: Encrypt-then-MAC only; prevents CBC padding oracle attacks.
# Only takes effect for non-AEAD ciphers.
ssh_harden_crypto_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com

# Key Exchange: Curve25519 + post-quantum hybrid + strong RSA.
ssh_harden_crypto_kex_algos:
  # OpenSSH 9.9+
  - "{{ [
      'mlkem768x25519-sha256',
      'sntrup761x25519-sha512',
    ]
    if ssh_harden_crypto_post_quantum_enabled else [] }}"
  - curve25519-sha256
  # Makes /etc/ssh/moduli irrelevant, OpenSSH 7.3+
  - "{{ [
      'diffie-hellman-group16-sha512',
      'diffie-hellman-group18-sha512',
    ]
    if ssh_harden_crypto_rsa_enabled else [] }}"

# Host key algorithms: Ed25519 + strong RSA.
ssh_harden_crypto_host_key_algos:
  - ssh-ed25519
  - ssh-ed25519-cert-v01@openssh.com
  - "{{ [
      'rsa-sha2-512',
      'rsa-sha2-512-cert-v01@openssh.com',
    ]
    if ssh_harden_crypto_rsa_enabled else [] }}"

# Regex to detect host key type (\1) and bits (\2) based on file names.
ssh_host_key_regex_all: '(?:\b|_)(ed25519|rsa|ecdsa)[-_.]?(\d*)(?:\b|_)'
ssh_host_key_regex_rsa: '(?:\b|_)(rsa)[-_.]?(\d*)(?:\b|_)'
