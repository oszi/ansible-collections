---
- name: Set system locale
  ansible.builtin.shell: |
    set -euo pipefail
    before="$(localectl status)"
    localectl set-locale {{ locale_conf.split() | map('quote') | join(' ') }}
    after="$(localectl status)"
    [ "$before" = "$after" ] || echo CHANGED
  args:
    executable: /bin/bash
  register: _locale_set_result
  changed_when: "'CHANGED' in _locale_set_result.stdout_lines"
