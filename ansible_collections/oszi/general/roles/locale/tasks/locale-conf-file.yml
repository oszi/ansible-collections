---
- name: Ensure locale_conf is multiline
  ansible.builtin.set_fact:
    locale_conf: "{{ locale_conf.split() | join('\n') }}\n"

- name: Assert valid locale_conf
  ansible.builtin.assert:
    that:
      - "'=' in locale_conf"
      - "locale_conf.splitlines() | map('regex_search', locale_conf_line_regex) | select('none') is not truthy"
      - "'LC_ALL=' not in locale_conf"
    fail_msg: "locale_conf must contain LANG/LANGUAGE/LC_* settings but not LC_ALL (man locale.conf.5); no comments or empty lines"
    success_msg: "locale_conf seems to be valid"

- name: "Check for a symlink at {{ locale_conf_path }}"
  ansible.builtin.stat:
    path: "{{ locale_conf_path }}"
    follow: false
  register: _locale_conf_path_result

# Write the target of a symlink, even a dangling one (copy with follow replaces those with a file).
- name: "Install locale conf file {{ locale_conf_path }}"
  ansible.builtin.copy:
    content: "{{ locale_conf }}"
    dest: "{{ _locale_conf_path_result.stat.lnk_source
      if _locale_conf_path_result.stat.islnk | default(false) else locale_conf_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
