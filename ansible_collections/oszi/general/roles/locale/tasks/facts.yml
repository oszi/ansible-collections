---
- name: Detect locale charmap
  ansible.builtin.shell: |
    set -aeuo pipefail
    if [ -r /etc/locale.conf ]; then
      . /etc/locale.conf
    fi
    locale charmap
  args:
    executable: /bin/bash
  register: _locale_charmap_result
  changed_when: false
  check_mode: false

- name: Export locale role facts
  ansible.builtin.set_fact:
    locale_charmap: "{{ _locale_charmap_result.stdout }}"
    cacheable: true  # Persists through all plays.
