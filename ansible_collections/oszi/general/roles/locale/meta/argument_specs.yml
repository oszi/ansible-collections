---
argument_specs:
  main:
    short_description: System locale settings
    description:
      - Manages system locale settings via systemd localectl
    author:
      - "David O. (oszi.dev)"
    options:
      locale_conf:
        description:
          - System locale settings in the format used by /etc/locale.conf and localectl (man locale.conf.5);
            whitespace separated LANG, LANGUAGE, LC_* variables; comments and quotes are not allowed
          - Default is en_US.UTF-8 with en_IE formats for workstations, empty for other hosts
          - Empty string skips locale settings but locale facts are still gathered
        type: str
        required: false

      locale_file_implementation:
        description:
          - Use legacy file implementation instead of systemd localectl
          - Default is true in containers, false otherwise
        type: bool
        required: false

  facts:
    short_description: Facts only entrypoint
    description:
      - Get locale role facts without changing anything; also asserts root
      - Fact `locale_charmap` contains the detected locale charmap
