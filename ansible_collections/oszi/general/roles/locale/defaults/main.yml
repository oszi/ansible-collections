---
# System locale in the format used by /etc/locale.conf and localectl
# Set to an empty string to skip.
# XXX: Remove deprecated baselinux defaults in 5.0.0
locale_conf: |-
  {% if baselinux_set_locale is defined -%}
  {{ baselinux_set_locale -}}
  {% elif 'workstations' in group_names -%}
  LANG=en_US.UTF-8
  LANGUAGE=en_US
  LC_COLLATE=C.UTF-8
  LC_ADDRESS=en_IE.UTF-8
  LC_IDENTIFICATION=en_IE.UTF-8
  LC_MEASUREMENT=en_IE.UTF-8
  LC_MESSAGES=en_IE.UTF-8
  LC_MONETARY=en_IE.UTF-8
  LC_NAME=en_IE.UTF-8
  LC_NUMERIC=en_IE.UTF-8
  LC_PAPER=en_IE.UTF-8
  LC_TELEPHONE=en_IE.UTF-8
  LC_TIME=en_IE.UTF-8
  {% endif -%}

# Use legacy file implementation instead of localectl?
locale_file_implementation: "{{ ansible_facts.virtualization_type == 'container' }}"
