---
- name: Configure unix groups
  ansible.builtin.group:
  args: "{{ item }}"
  loop: "{{ users_groups_list | oszi.utils.unique_nested_list('name') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure unix users
  ansible.builtin.user:
  args: "{{ item }}"
  loop: "{{ users_list | oszi.utils.unique_nested_list('name') }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Allow passwordless sudo for the specified groups
  when: users_sudo_nopasswd_groups is truthy
  ansible.builtin.copy:
    content: |
      {% for group in users_sudo_nopasswd_groups %}
      %{{ group }} ALL=(ALL) NOPASSWD: ALL
      {% endfor %}
    dest: "/etc/sudoers.d/nopasswd_groups"
    owner: "root"
    group: "root"
    mode: "0440"
    validate: "visudo -csf %s"

- name: Ensure passwordless sudo for groups is NOT configured
  when: users_sudo_nopasswd_groups is not truthy
  ansible.builtin.file:
    path: "/etc/sudoers.d/nopasswd_groups"
    state: "absent"
