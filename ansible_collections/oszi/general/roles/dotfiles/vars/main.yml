---
# Absolute path of the default XDG_CONFIG_HOME - the user environment is unknown to ansible.
# * Tasks from dotfiles-user.yml are run as dotfiles_user_item!
dotfiles_xdg_config_path: "{{ [dotfiles_user_info.home, '.config'] | path_join }}"

# Placeholders for loop and task variables to pass argument_specs validation.
# Wrapping loop_var prevents "loop variable is already in use" warnings.
# Task variables take precedence over vars/main.
dotfiles_user_item: "{{ _dotfiles_user_item_var | default('__PLACEHOLDER__') }}"
dotfiles_user_info:
  name: "__PLACEHOLDER__"
  comment: "__PLACEHOLDER__"
  home: "__PLACEHOLDER__"
  password: "__PLACEHOLDER__"
  shell: "__PLACEHOLDER__"
  system: false
  uid: 0
  group: 0
  groups: []
  changed: false
