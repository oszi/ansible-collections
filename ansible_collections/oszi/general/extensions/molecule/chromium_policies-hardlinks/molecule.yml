---
# Molecule scenario for oszi.general.chromium_policies with hard links; shared settings come from ../config.yml.
# All policy paths are on the container's root filesystem, as the hard links require.
provisioner:
  inventory:
    group_vars:
      all:
        chromium_policies_use_hard_links: true
        # Excludes the Flatpak and Snap paths and includes Google Chrome's, as with the flatpak and snap
        # roles disabled and google_chrome enabled in the same inventory.
        flatpak_disabled: true
        snap_disabled: true
        google_chrome_enabled: true
        molecule_chromium_policies_bases: "{{ molecule_chromium_policies_bases_common
          + molecule_chromium_policies_bases_distro }}"
        molecule_chromium_policies_bases_common:
          - /etc/chromium/policies
          - /etc/opt/chrome/policies
      redhat:
        molecule_chromium_policies_bases_distro: []
        molecule_verify_paths:
          - &flatpak_absent {path: /var/lib/flatpak, state: absent}
          - &snap_absent {path: /var/snap/chromium, state: absent}
          - {path: /etc/chromium-browser, state: absent}
      debian:
        molecule_chromium_policies_bases_distro:
          - /etc/chromium-browser/policies
        molecule_verify_paths:
          - *flatpak_absent
          - *snap_absent
