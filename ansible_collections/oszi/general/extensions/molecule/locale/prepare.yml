---
- name: Import the shared prepare playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.prepare

# The Debian and Ubuntu images ship /etc/default/locale as a dangling symlink to ../locale.conf. The role's copy
# with follow: true replaces a dangling symlink with a regular file instead of creating its target, so the
# target is seeded with another locale as on an installed system.
- name: Seed the system locale file for the locale scenario
  hosts: debian
  become: true
  gather_facts: false
  tasks:
    - name: Ensure /etc/locale.conf exists
      ansible.builtin.copy:
        content: "LANG=C\n"
        dest: /etc/locale.conf
        owner: root
        group: root
        mode: "0644"
        force: false
