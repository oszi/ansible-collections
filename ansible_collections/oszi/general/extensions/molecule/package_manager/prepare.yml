---
- name: Import the shared prepare playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.prepare

- name: Prepare the package_manager scenario
  hosts: all
  become: true
  gather_facts: false
  tasks:
    # Blacklisted by the scenario, so the role must remove it again.
    - name: Ensure the blacklisted test package is installed
      ansible.builtin.package:
        name: "tree"
        state: "present"

    # Fedora 45+ ships its repo files in /usr/share/dnf5/repos.d, which the role must not edit; the disabled
    # legacy-style stub stands in for the pre-45 layout and third-party files the replacements target.
    - name: Seed a disabled legacy repo file in /etc/yum.repos.d
      when: "'redhat' in group_names"
      ansible.builtin.copy:
        dest: "/etc/yum.repos.d/fedora-molecule.repo"
        content: |
          [fedora-molecule]
          name=Molecule seed
          #baseurl=http://download.example/pub/fedora/linux/releases/$releasever/Everything/$basearch/os/
          metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=$basearch
          enabled=0

          [fedora-molecule-debuginfo]
          name=Molecule seed - Debug
          #baseurl=http://download.example/pub/fedora/linux/releases/$releasever/Everything/$basearch/debug/tree/
          enabled=0
        owner: "root"
        group: "root"
        mode: "0644"
