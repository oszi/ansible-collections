---
# Molecule scenario for oszi.general.package_manager; shared settings come from ../config.yml.
# Group_vars replace lists as a whole, so the per-distribution lists are built from _common and _distro parts.
provisioner:
  inventory:
    group_vars:
      all:
        package_manager_apt_conf:
          Acquire::Retries: 3
          APT::Get::Show-Versions: "true"
        package_manager_dnf_conf:
          max_parallel_downloads: 10
          defaultyes: "True"
        # Nested lists exercise the flatten step; tree is installed by prepare, blacklisted,
        # and also requested here to prove the blacklist wins over the extra packages.
        package_manager_extra_packages:
          - file
          - [less, tree]
        package_manager_blacklisted_packages:
          - [tree]
        molecule_prepare_packages: [tree]
        molecule_verify_packages:
          present: [file, less]
          absent: [tree]
      fedora:
        # Fedora 45+ ships its repo files in /usr/share/dnf5/repos.d and they are adjusted through overrides;
        # the replacements run on the disabled legacy-style stub seeded in /etc/yum.repos.d, which stands in
        # for the pre-45 layout and the third-party files the role targets. Molecule interpolates dollar
        # signs in molecule.yml, hence the doubled ones in the stub.
        # A comment-only change there, countme off and a display name in the override: no active repository
        # setting changes. The glob covers fedora, fedora-debuginfo and fedora-source; updates is a separate ID.
        molecule_prepare_seed_files:
          - path: /etc/yum.repos.d/fedora-molecule.repo
            content: |
              [fedora-molecule]
              name=Molecule seed
              #baseurl=http://download.example/pub/fedora/linux/releases/$$releasever/Everything/$$basearch/os/
              metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-$$releasever&arch=$$basearch
              enabled=0

              [fedora-molecule-debuginfo]
              name=Molecule seed - Debug
              #baseurl=http://download.example/pub/fedora/linux/releases/$$releasever/Everything/$$basearch/debug/tree/
              enabled=0

              [fedora-molecule-source]
              name=Molecule seed - Source
              #baseurl=http://download.example/pub/fedora/linux/releases/$$releasever/Everything/source/tree/
              enabled=0
        # Replacements apply in order per file: the second one sees the https scheme of the first and is
        # scoped to the source section with after (DOTALL, so no line anchor).
        package_manager_repo_replacements:
          - regexp: '^#baseurl=http://download\.example/'
            replace: '#baseurl=https://download.example/'
          - after: '\[fedora-molecule-source\]'
            regexp: '^#baseurl=https://download\.example/'
            replace: '#baseurl=https://source.example/'
        package_manager_dnf_repo_overrides:
          - repo: "fedora*"
            options: {countme: 0, name: "Fedora override"}
        molecule_verify_paths:
          - {path: /etc/dnf/dnf.conf, mode: "0644", owner: root, group: root}
          - {path: /etc/dnf/repos.override.d/90-ansible-managed.repo, mode: "0644", owner: root, group: root}
          - {path: /etc/apt/apt.conf.d/99-ansible-managed.conf, state: absent}
        molecule_verify_commands:
          - {cmd: "command -v file less"}
          - {cmd: "! command -v tree"}
          # Options land in [main] next to the shipped tsflags and are parsed by dnf itself.
          - {cmd: "grep -Fx max_parallel_downloads=10 /etc/dnf/dnf.conf && grep -Fx tsflags=nodocs /etc/dnf/dnf.conf"}
          - {cmd: "dnf --dump-main-config | grep -E '^(max_parallel_downloads|defaultyes) '", stdout_contains: "max_parallel_downloads = 10"}
          - {cmd: "dnf --dump-main-config | grep -E '^defaultyes '", stdout: "defaultyes = 1"}
          - {cmd: "! grep -q '^#baseurl=http://download\\.example/' /etc/yum.repos.d/fedora-molecule.repo"}
          # The after-scoped replacement rewrites the source section only; the other two keep download.example.
          - {cmd: "grep -c '^#baseurl=https://download\\.example/' /etc/yum.repos.d/fedora-molecule.repo", stdout: "2"}
          - {cmd: "grep -c 'source\\.example' /etc/yum.repos.d/fedora-molecule.repo", stdout: "1"}
          - {cmd: "grep -A2 '^\\[fedora-molecule-source\\]' /etc/yum.repos.d/fedora-molecule.repo | grep -c '^#baseurl=https://source\\.example/'", stdout: "1"}
          - {cmd: "grep -q '^metalink=https://mirrors.fedoraproject.org/' /etc/yum.repos.d/fedora-molecule.repo"}
          # The shipped files stay intact; the override applies to every repository matching the glob.
          - {cmd: "rpm -V fedora-repos"}
          - {cmd: "cat /etc/dnf/repos.override.d/90-ansible-managed.repo", stdout: "[fedora*]\ncountme=0\nname=Fedora override"}
          - {cmd: "dnf --dump-repo-config=fedora | grep -Fx 'countme = 0'"}
          - {cmd: "dnf --dump-repo-config=fedora,fedora-debuginfo,fedora-source | grep -cFx 'name = Fedora override'", stdout: "3"}
      debian:
        # Ubuntu hosts are in the debian group too: the _distro parts are keyed by distribution and selected
        # by group membership, not by the alphabetical precedence of the ubuntu group over debian.
        molecule_distro: "{{ 'ubuntu' if 'ubuntu' in group_names else 'debian' }}"
        # Molecule interpolates dollar signs in molecule.yml, hence the doubled regexp anchors.
        # A trailing slash on the URIs is equivalent for apt; the cache update after the change proves it.
        # The shipped Ubuntu URIs already end with a slash, so the slash is dropped there instead.
        package_manager_repo_replacements: "{{ package_manager_repo_replacements_distro[molecule_distro] }}"
        package_manager_repo_replacements_distro:
          debian:
            - regexp: '^(URIs: \S*[^/\s])$$'
              replace: '\1/'
          ubuntu:
            - regexp: '^(URIs: \S+)/$$'
              replace: '\1'
        molecule_verify_paths:
          - {path: /etc/apt/apt.conf.d, state: directory, mode: "0755", owner: root, group: root}
          - {path: /etc/apt/apt.conf.d/99-ansible-managed.conf, mode: "0644", owner: root, group: root}
        molecule_verify_commands: "{{ molecule_verify_commands_common + molecule_verify_commands_distro[molecule_distro] }}"
        molecule_verify_commands_common:
          - {cmd: "command -v file less"}
          - {cmd: "! command -v tree"}
          - cmd: "cat /etc/apt/apt.conf.d/99-ansible-managed.conf"
            stdout: "Acquire::Retries \"3\";\nAPT::Get::Show-Versions \"true\";"
          - cmd: "apt-config shell RETRIES Acquire::Retries SHOWV APT::Get::Show-Versions"
            stdout: "RETRIES='3'\nSHOWV='true'"
          - {cmd: "apt-get update -qq"}
        molecule_verify_commands_distro:
          debian:
            - cmd: "grep '^URIs:' /etc/apt/sources.list.d/debian.sources"
              stdout: "URIs: http://deb.debian.org/debian/\nURIs: http://deb.debian.org/debian-security/"
          ubuntu:
            - cmd: "grep '^URIs:' /etc/apt/sources.list.d/ubuntu.sources"
              stdout: "URIs: http://archive.ubuntu.com/ubuntu\nURIs: http://security.ubuntu.com/ubuntu"
