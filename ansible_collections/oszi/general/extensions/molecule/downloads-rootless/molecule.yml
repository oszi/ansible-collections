---
# Rootless molecule scenario for oszi.general.downloads: the shared converge runs the role as tester
# with tilde destinations and without owner or group. prepare.yml serves the test files from
# http://127.0.0.1:8000 inside each instance, so no internet access is needed.
provisioner:
  inventory:
    group_vars:
      all:
        users_list:
          - name: tester
            shell: /bin/bash
        molecule_become_user: tester
        # The converge runs the bootstrap as tester; prepare.yml updates the cache as root if needed.
        bootstrap_package_update_cache: false
        # sha256 of the fixed payload written by prepare.yml.
        molecule_downloads_payload_sha256: "17e03c4d745c02935c88952c3a7a1fdde1ff7e42bee3a3be17c2692dca7a0287"
        downloads_list:
          # Missing parent directories under the home; the script appends one line per run.
          - dest: "~/molecule/downloads/payload.txt"
            url: http://127.0.0.1:8000/payload.txt
            checksum: "sha256:{{ molecule_downloads_payload_sha256 }}"
            mode: "0640"
            directory_mode: "0750"
            post_install_script: |
              printf '%s %s\n' "$$DOWNLOADS_ITEM_DEST" "$$(id -un)" >> post-install.log
          # Directory destination with a checksum file URL; the script extracts the archive.
          - dest: "~/molecule/tool/"
            url: http://127.0.0.1:8000/tool.tar.gz
            checksum: "sha256:http://127.0.0.1:8000/SHA256SUMS"
            mode: "0644"
            post_install_script: |
              tar -xzf "$$DOWNLOADS_ITEM_DEST"
        molecule_verify_paths:
          - {path: /home/tester/molecule, state: directory, owner: tester, group: tester}
          - {path: /home/tester/molecule/downloads, state: directory, mode: "0750", owner: tester, group: tester}
          - {path: /home/tester/molecule/downloads/payload.txt, mode: "0640", owner: tester, group: tester}
          - {path: /home/tester/molecule/downloads/post-install.log, owner: tester, group: tester}
          - {path: /home/tester/molecule/tool/tool.tar.gz, mode: "0644", owner: tester, group: tester}
          - {path: /home/tester/molecule/tool/bin/tool, mode: "0755", owner: tester}
          # The tilde is expanded for the effective user, never literally or for root.
          - {path: "/home/tester/~", state: absent}
          - {path: /root/molecule, state: absent}
        molecule_verify_commands:
          - cmd: "echo '{{ molecule_downloads_payload_sha256 }}  /home/tester/molecule/downloads/payload.txt' | sha256sum -c --quiet"
          # One line: the second converge found the matching checksum and did not re-run the script.
          - cmd: "cat ~/molecule/downloads/post-install.log"
            user: tester
            stdout: "/home/tester/molecule/downloads/payload.txt tester"
          - {cmd: "~/molecule/tool/bin/tool", user: tester, stdout: "molecule tool"}
