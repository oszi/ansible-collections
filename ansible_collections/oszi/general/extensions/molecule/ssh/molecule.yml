---
# Molecule scenario for oszi.general.ssh with the defaults; shared settings come from ../config.yml.
# The container guard sets ssh_server_disabled, so the role removes openssh-server, which prepare installs
# first, and deletes the overridable sshd_config. Host keys and the client package stay.
# Group_vars replace lists as a whole, so the command list is built from _common and _distro parts.
provisioner:
  inventory:
    group_vars:
      all:
        molecule_verify_paths:
          - {path: /etc/ssh/sshd_config, state: absent}
          - {path: /etc/ssh/authorized_keys.d, state: absent}
          # Pre-existing host keys are left alone.
          - {path: /etc/ssh/ssh_host_ed25519_key, mode: "0600", owner: root}
        molecule_verify_commands: "{{ molecule_verify_commands_common + molecule_verify_commands_distro }}"
        molecule_verify_commands_common:
          - {cmd: "! command -v sshd"}
        molecule_verify_packages:
          absent: [openssh-server]
      redhat:
        # The unit files go with the package.
        molecule_verify_commands_distro:
          - {cmd: "systemctl show --property=LoadState --value sshd.service", stdout: "not-found"}
          - {cmd: "systemctl show --property=LoadState --value sshd.socket", stdout: "not-found"}
      debian:
        molecule_verify_commands_distro:
          - {cmd: "systemctl show --property=LoadState --value ssh.service", stdout: "not-found"}
          - {cmd: "systemctl show --property=LoadState --value ssh.socket", stdout: "not-found"}
