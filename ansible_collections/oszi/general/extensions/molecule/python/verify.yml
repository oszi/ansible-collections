---
- name: Import the shared verify playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.verify

- name: Verify the system pip
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Check the system pip
      ansible.builtin.command:
        cmd: "python3 -m pip --version"
      changed_when: false
