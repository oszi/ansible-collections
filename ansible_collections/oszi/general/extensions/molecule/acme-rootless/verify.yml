---
- name: Import the shared verify playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.verify

- name: Verify the rootless acme defaults
  hosts: all
  become: true
  become_user: tester
  gather_facts: false
  tasks:
    # Public, so the role defaults derived from the effective user are visible below.
    - name: Include the acme role as tester
      ansible.builtin.include_role:
        name: oszi.general.acme
        public: true

    - name: Assert the rootless defaults
      ansible.builtin.assert:
        that:
          - "ansible_facts.user_uid | int != 0"
          - "acme_install_python3_cryptography is false"
          - "acme_account_key_path == '~/.letsencrypt/account.pem'"
          - "acme_disabled is false"
        quiet: true
