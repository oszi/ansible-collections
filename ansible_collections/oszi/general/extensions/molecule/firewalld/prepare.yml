---
- name: Import the shared prepare playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.prepare

- name: Install firewalld for the uninstall path
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure firewalld is installed
      ansible.builtin.package:
        name: "firewalld"
        state: "present"
