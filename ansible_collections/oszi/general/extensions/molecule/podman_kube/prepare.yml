---
# The shared prepare installs podman, which provides podman-kube@.service.
- name: Import the shared prepare playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.prepare

# The absent item must exist before the converge to exercise the uninstall path; its instance is enabled
# without starting it, like the present_disabled instance the role has to disable. The base directory is
# created with a different mode than the one the role sets.
- name: Seed a spec for the absent item
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure the spec and static files directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/containers/kube, mode: "0700"}
        - {path: /srv/kubeold, mode: "0755"}

    - name: Seed the static file and the uninstall script marker
      ansible.builtin.copy:
        content: "molecule\n"
        dest: "{{ item }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - "/srv/kubeold/data.txt"
        - "/srv/kubeold.marker"

    - name: Seed the spec
      ansible.builtin.copy:
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: old
          spec:
            containers:
              - name: old
                image: quay.io/podman/hello:latest
        dest: "/etc/containers/kube/old.yaml"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: Enable the seeded and the present_disabled podman-kube instances without starting them
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
      loop:
        - "podman-kube@-etc-containers-kube-old.yaml.service"
        - "podman-kube@-etc-containers-kube-test.yaml.service"
