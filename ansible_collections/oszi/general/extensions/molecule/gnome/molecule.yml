---
# Molecule scenario for oszi.general.gnome; shared settings come from ../config.yml.
# The role's default package lists are not overridden, so packages renamed or dropped in a new distribution
# release fail the converge; this installs the full GNOME package set (about 1 GB per platform).
# The verified packages are a subset covering each distro-conditional branch of the defaults.
# group_vars replace lists as a whole, so the per-distribution lists are built from _common and _distro parts;
# the ubuntu platform is also in the debian group and inherits the lists it does not redefine.
provisioner:
  inventory:
    group_vars:
      all:
        # Small packages from the role's default blacklist, installed by prepare so the role must remove them.
        molecule_prepare_packages: [gnome-tour]
        molecule_verify_commands:
          - {cmd: "gnome-shell --version", stdout_contains: "GNOME Shell"}
          - {cmd: "command -v gnome-tweaks dconf-editor getfacl"}
          - {cmd: "grep -qa org.gnome.desktop.interface /usr/share/glib-2.0/schemas/gschemas.compiled"}
        molecule_verify_packages:
          present: "{{ molecule_verify_packages_present_common + molecule_verify_packages_present_distro }}"
          absent: "{{ molecule_verify_packages_absent_common + molecule_verify_packages_absent_distro }}"
        molecule_verify_packages_present_common:
          - gnome-shell
          - gnome-control-center
          - ptyxis
          - xdg-desktop-portal-gnome
          - gnome-shell-extension-user-theme
          - acl
        # Blacklisted replacements of default packages, and the seeded package.
        molecule_verify_packages_absent_common: [gnome-tour, eog, gedit, gnome-terminal, totem]
      fedora:
        molecule_prepare_packages: [gnome-tour, fedora-chromium-config, gnome-shell-extension-background-logo]
        molecule_verify_packages_present_distro:
          - gnome-extensions-app
          - gnome-shell-extension-appindicator
        molecule_verify_packages_absent_distro:
          - fedora-chromium-config
          - gnome-shell-extension-background-logo
          - gnome-shell-extension-blur-my-shell
      debian:
        # One of the pre-installed games the role blacklists on the Debian family.
        molecule_prepare_packages: [gnome-tour, gnome-mines]
        molecule_verify_packages_present_distro: [gnome-shell-extension-prefs, gnome-shell-extensions]
        molecule_verify_packages_absent_distro: [gnome-mines]
      ubuntu:
        molecule_verify_packages_present_distro:
          - gnome-shell-extension-prefs
          - gnome-shell-extensions
          - gnome-shell-ubuntu-extensions
