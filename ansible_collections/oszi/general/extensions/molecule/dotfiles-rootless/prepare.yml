---
- name: Import the shared prepare playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.prepare

# Existing directories with a mode the role would not choose; verify.yml asserts they are kept.
- name: Prepare existing directories for the dotfiles scenario
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure the tester's directories exist with their own mode
      ansible.builtin.file:
        path: "{{ item }}"
        state: "directory"
        owner: "tester"
        group: "tester"
        mode: "0755"
      loop:
        - "/home/tester/.config"
        - "/home/tester/.molecule"
