---
# Molecule scenario for oszi.general.wireguard disabled; shared settings come from ../config.yml.
# Prepare installs the role's packages and seeds a config file first: the uninstall path removes the
# packages only and keeps /etc/wireguard. On Debian only the wireguard metapackage is listed, so
# wireguard-tools stays installed as its former dependency, while Fedora loses the wg command.
provisioner:
  inventory:
    group_vars:
      all:
        wireguard_disabled: true
        molecule_prepare_seed_files:
          - {path: /etc/wireguard/wg0.conf, content: "[Interface]\nPrivateKey = placeholder\n", mode: "0600"}
        molecule_verify_paths:
          - {path: /etc/wireguard/wg0.conf, mode: "0600", owner: root, group: root}
      redhat:
        molecule_prepare_packages: [wireguard-tools]
        molecule_verify_packages:
          absent: [wireguard-tools]
        molecule_verify_commands:
          - {cmd: "! command -v wg"}
      debian:
        molecule_prepare_packages: [wireguard]
        molecule_verify_packages:
          present: [wireguard-tools]
          absent: [wireguard]
        molecule_verify_commands:
          - {cmd: "command -v wg"}
