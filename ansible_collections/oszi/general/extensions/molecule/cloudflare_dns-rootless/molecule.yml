---
# Rootless molecule scenario for oszi.general.cloudflare_dns: the shared converge runs the role as tester.
# The CloudFlare API is external, so only the no-op path with an empty zone is tested.
provisioner:
  inventory:
    group_vars:
      all:
        users_list:
          - name: tester
            shell: /bin/bash
        molecule_become_user: tester
        cloudflare_dns_zone: ""
        cloudflare_dns_host_record: "molecule"
