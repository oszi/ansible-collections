---
- name: Import the shared verify playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.verify

- name: Verify the rootless cloudflare_dns no-op path
  hosts: all
  become: true
  become_user: tester
  gather_facts: false
  tasks:
    # Public, so the role defaults are visible to the assertion below.
    - name: Include the cloudflare_dns role as tester
      ansible.builtin.include_role:
        name: oszi.general.cloudflare_dns
        public: true

    - name: Assert that the CloudFlare tasks were skipped as tester
      ansible.builtin.assert:
        that:
          - "ansible_facts.user_uid | int != 0"
          - "cloudflare_dns_host_record_a_value == ''"
          - "cloudflare_dns_host_record_aaaa_value == ''"
        quiet: true
