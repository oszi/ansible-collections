---
- name: Import the shared prepare playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.prepare

# The seeded timer is enabled like a real installation's, so the role must also clean up its symlink.
- name: Enable the seeded borgmatic timer
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Enable the seeded borg timer
      ansible.builtin.systemd_service:
        name: "borg.timer"
        enabled: true
        daemon_reload: true
