---
# Molecule scenario for oszi.general.borgmatic with the default borgmatic_enabled: false, standalone:
# without oszi.general.shell the aliases path is empty and the role skips it (the borgmatic scenario covers it).
# Prepare seeds the files of an earlier installation and enables its timer, so the uninstall path has work to do.
provisioner:
  inventory:
    group_vars:
      all:
        molecule_prepare_seed_files:
          - {path: /opt/borgmatic/bin/borgmatic, content: "#!/bin/sh\n", mode: "0755"}
          - {path: /etc/borgmatic/config.yaml, content: "source_directories: [/etc]\n", mode: "0600"}
          - {path: /etc/profile.d/borgmatic.sh, content: "alias borg1='borg --remote-path=borg1'\n"}
          - {path: /etc/systemd/system/borg.service, content: "[Service]\nType=oneshot\nExecStart=/bin/true\n"}
          - path: /etc/systemd/system/borg.timer
            content: "[Timer]\nOnCalendar=daily\n\n[Install]\nWantedBy=timers.target\n"
        molecule_verify_paths:
          - {path: /opt/borgmatic, state: absent}
          - {path: /etc/borgmatic/config.yaml, state: absent}
          - {path: /etc/profile.d/borgmatic.sh, state: absent}
          - {path: /etc/systemd/system/borg.service, state: absent}
          - {path: /etc/systemd/system/borg.timer, state: absent}
          - {path: /etc/systemd/system/timers.target.wants/borg.timer, state: absent}
        molecule_verify_units:
          - {name: borg.timer, load: not-found}
