---
# The shared prepare installs podman, which provides the quadlet generator.
- name: Import the shared prepare playbook
  ansible.builtin.import_playbook: oszi.utils.molecule.prepare

# The absent item must exist before the converge to exercise the uninstall path; the seeded unit is
# loaded by the daemon-reload. The systemd directory is created with a different mode than the one the
# role sets.
- name: Seed a quadlet for the absent item
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure the quadlet and static files directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/containers/systemd, mode: "0700"}
        - {path: /srv/old, mode: "0755"}

    - name: Seed the static file and the uninstall script marker
      ansible.builtin.copy:
        content: "molecule\n"
        dest: "{{ item }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - "/srv/old/data.txt"
        - "/srv/old.marker"

    - name: Seed the quadlet
      ansible.builtin.copy:
        content: |
          [Container]
          Image=quay.io/podman/hello:latest
        dest: "/etc/containers/systemd/old.container"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: Reload systemd to generate the seeded unit
      ansible.builtin.systemd:
        daemon_reload: true
