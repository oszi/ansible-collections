---
# Molecule scenario for oszi.general.gnome_users as root with tester as the GNOME user; shared settings
# come from ../config.yml. A subset of the role's default dconf settings, selected by key from
# gnome_users_dconf_vars_default in role scope, replaces the long default list: each setting is a podman exec.
# Prepare installs what the dconf module needs, creates ~/Pictures and seeds the Ptyxis default profile UUID.
# group_vars replace lists as a whole, so the per-distribution lists are built from _common and _distro parts.
provisioner:
  inventory:
    group_vars:
      all:
        users_list:
          - name: tester
            shell: /bin/bash
        gnome_users: [tester]
        # Plain values, lists, tuples, typed values, and fact-dependent defaults (containers are guests,
        # the Ubuntu platform selects the Yaru themes).
        molecule_gnome_users_dconf_keys:
          - /org/gnome/desktop/interface/clock-format
          - /org/gnome/desktop/interface/gtk-theme
          - /org/gnome/desktop/input-sources/xkb-options
          - /org/gnome/desktop/input-sources/sources
          - /org/gnome/desktop/session/idle-delay
          - /org/gnome/desktop/thumbnailers/disable-all
          - /org/gnome/desktop/wm/keybindings/show-desktop
          - /org/gnome/shell/extensions/user-theme/name
        gnome_users_dconf_vars: "{{ gnome_users_dconf_vars_default | dict2items
          | selectattr('key', 'in', molecule_gnome_users_dconf_keys) | items2dict }}"
        gnome_users_dconf_custom_keybindings:
          - binding: "'<Super>Return'"
            command: "'ptyxis --new-window'"
            name: "'Terminal'"
        # Applied under the profile UUID prepare.yml seeds in /org/gnome/Ptyxis/default-profile-uuid.
        gnome_users_dconf_ptyxis_terminal_default_profile_vars:
          scrollback-lines: "uint32 20000"
        # prepare.yml creates ~/Pictures only, so the Screencasts symlink is skipped (no ~/Videos).
        gnome_users_screenshots_path: /home/tester/Captures
        molecule_verify_paths:
          - {path: /home/tester/.themes, state: directory, owner: tester, group: tester}
          - path: /home/tester/.themes/transparent/gnome-shell/gnome-shell.css
            mode: "0644"
            owner: tester
            group: tester
          - {path: /home/tester/.config/dconf/user, owner: tester, group: tester}
          - {path: /home/tester/Captures, state: directory, mode: "0750", owner: tester, group: tester}
          - {path: /home/tester/Pictures/Screenshots, state: link, src: /home/tester/Captures, owner: tester}
          - {path: /home/tester/Videos, state: absent}
          # Nothing is written for root.
          - {path: /root/.config/dconf, state: absent}
        molecule_verify_commands: "{{ molecule_verify_commands_common + molecule_verify_commands_distro }}"
        molecule_verify_commands_common:
          - {cmd: "dconf read /org/gnome/desktop/interface/clock-format", user: tester, stdout: "'24h'"}
          - cmd: "dconf read /org/gnome/desktop/input-sources/xkb-options"
            user: tester
            stdout: "['apple:alupckeys', 'kpdl:dotoss', 'lv3:ralt_alt']"
          - {cmd: "dconf read /org/gnome/desktop/input-sources/sources", user: tester, stdout: "[('xkb', 'us'), ('xkb', 'hu')]"}
          - {cmd: "dconf read /org/gnome/desktop/session/idle-delay", user: tester, stdout: "uint32 0"}
          - {cmd: "dconf read /org/gnome/desktop/thumbnailers/disable-all", user: tester, stdout: "false"}
          - {cmd: "dconf read /org/gnome/desktop/wm/keybindings/show-desktop", user: tester, stdout: "@as []"}
          - {cmd: "dconf read /org/gnome/shell/extensions/user-theme/name", user: tester, stdout: "'transparent'"}
          # Custom keybinding attributes and the key-map helper pointing at them.
          - cmd: "dconf read /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings"
            user: tester
            stdout: "['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']"
          - cmd: "dconf dump /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/"
            user: tester
            stdout: "[/]\nbinding='<Super>Return'\ncommand='ptyxis --new-window'\nname='Terminal'"
          # The Ptyxis profile settings land under the seeded default profile UUID.
          - {cmd: "dconf read /org/gnome/Ptyxis/Profiles/0123abcd/scrollback-lines", user: tester, stdout: "uint32 20000"}
          # The theme's CSS is the role's file, not an empty copy.
          - {cmd: "grep -q '#panel' /home/tester/.themes/transparent/gnome-shell/gnome-shell.css", user: tester}
      fedora:
        molecule_prepare_packages: [dconf, dbus-daemon, python3-psutil, python3-gobject-base]
        molecule_verify_commands_distro:
          - {cmd: "dconf read /org/gnome/desktop/interface/gtk-theme", user: tester, stdout: "'Adwaita'"}
      debian:
        molecule_prepare_packages: [dconf-cli, dconf-service, dbus-bin, python3-psutil, python3-gi]
        molecule_verify_commands_distro:
          - {cmd: "dconf read /org/gnome/desktop/interface/gtk-theme", user: tester, stdout: "'Adwaita'"}
      ubuntu:
        molecule_verify_commands_distro:
          - {cmd: "dconf read /org/gnome/desktop/interface/gtk-theme", user: tester, stdout: "'Yaru-dark'"}
